<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ROOF CAT ME PLAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rcm-theme.css">
  <style>
    html { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; color: var(--ink); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }
    .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: 0 20px; }

    /* 인사 영역 */
    .intro { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 0 22px; }
    .tagline { font-size: 14px; color: var(--ink-soft); line-height: 1.5; word-break: keep-all; }

    /* 그리드 */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }

    /* 카드 버튼 */
    .card {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 10px 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink);
      transition: transform 0.15s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active { transform: scale(0.97); }
    .card:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

    .ico { width: 100%; height: 84px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
    .ico svg { opacity: .55; }
    .card.bingo .ico { background: #C9E3EC; }
    .card.dokan .ico { background: #F6C9A0; }
    .card.gacha .ico { background: #F0D9C4; }
    .card.bti   .ico { background: #E9D3B0; }

    .card-label { font-size: 17px; font-weight: 800; color: var(--roof-text); text-align: center; line-height: 1.3; margin-top: 2px; }
    .card-sub { font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.5; }

    /* 탐정X (방탈출) — 다른 작품이라 어두운 톤 유지 */
    .card.escape {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: center;
      gap: 16px;
      padding: 20px 24px;
      background: #4A3F3A;
      border-color: #4A3F3A;
      color: var(--ivory);
    }
    .card.escape .ico { width: 56px; height: 56px; background: rgba(251,240,217,.12); flex-shrink: 0; }
    .card.escape .ico svg { opacity: .9; }
    .card.escape .card-label { color: var(--ivory); font-size: 17px; text-align: left; margin: 0; }
    .card.escape .card-sub { color: rgba(251,240,217,.78); text-align: left; }

    .logout { display: block; margin: 22px auto 0; background: none; border: 1.5px solid var(--line); border-radius: 999px; color: var(--ink-soft); font-size: 12px; padding: 8px 20px; cursor: pointer; font-family: inherit; }
    .footer { margin: 28px 0 18px; font-size: 12px; color: var(--ink-soft); text-align: center; }
  </style>
</head>
<body>

  <div class="rcm-hero">
    <img class="rcm-hero-logo" src="images/rcm-logo.png" alt="ROOF CAT ME">
    <span class="rcm-hero-badge">PLAY</span>
    <img class="rcm-hero-cast trio" src="images/hero-trio.png" alt="" width="480" height="360">
  </div>

  <main class="wrap">
    <div class="intro">
      <p class="tagline">고양이와 함께하는<br>루프캣미 놀이터</p>
      <span class="rcm-pill" id="hub-tickets">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A2B16" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>
        <span id="hub-tickets-n">가챠권 0장</span>
      </span>
    </div>

    <div class="grid">

      <a class="card bingo" href="bingo.html">
        <div class="ico"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4A3F3A" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg></div>
        <div class="card-label">냥빙고</div>
        <div class="card-sub">사진 한 장으로<br>AI 집사 판정</div>
      </a>

      <a class="card dokan" href="collection.html">
        <div class="ico"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4A3F3A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></div>
        <div class="card-label">고양이 도감</div>
        <div class="card-sub">QR로 개체 해금<br>몇 마리 만났어?</div>
      </a>

      <a class="card gacha" href="gacha.html">
        <div class="ico"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4A3F3A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 8.5l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4z"/></svg></div>
        <div class="card-label">냥가챠</div>
        <div class="card-sub">카드 뽑고<br>수집하기</div>
      </a>

      <a class="card bti" href="https://roofcat.me/">
        <div class="ico"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4A3F3A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M5 9L6 3l5 3.5h2L18 3l1 6c1 6-3 10-7 10S4 15 5 9z"/><circle cx="9.5" cy="12" r=".8"/><circle cx="14.5" cy="12" r=".8"/></svg></div>
        <div class="card-label">냥BTI</div>
        <div class="card-sub">나의 운명냥<br>찾아보기</div>
      </a>

      <a class="card escape" href="https://eomty.github.io/RoofCatMeER">
        <div class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FBF0D9" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></div>
        <div>
          <div class="card-label">탐정X의 잠입수사</div>
          <div class="card-sub">루프캣미 방탈출</div>
        </div>
      </a>

    </div>

    <button type="button" class="logout" onclick="doLogout()">로그아웃</button>
    <p class="footer">© ROOF CAT ME · 루프캣미</p>
  </main>
  <div class="rcm-roof"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqxMZf8xDfaQ1oAheXJAuYbWBBfZBkgvI",
  authDomain: "roofcatmeplay.firebaseapp.com",
  projectId: "roofcatmeplay",
  storageBucket: "roofcatmeplay.firebasestorage.app",
  messagingSenderId: "793320259272",
  appId: "1:793320259272:web:7ba8355067b03edc2b2ffd"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// 가챠권 표시 (캐시값 먼저, Firestore 값으로 갱신)
function showTickets(n){
  document.getElementById('hub-tickets-n').textContent = '가챠권 ' + (n||0) + '장';
}
showTickets(parseInt(localStorage.getItem('rcm_gacha_tickets')||'0',10));

onAuthStateChanged(auth, async user => {
  if(!user){
    location.href = 'login.html';
    return;
  }

  // Firestore에서 유저 데이터 로드
  try{
    const ref  = doc(db,'users',user.uid);
    const snap = await getDoc(ref);
    if(!snap.exists()) return; // 문서 없으면 종료 (login.html에서 처리)
    const data = snap.data();

    // 닉네임 → localStorage 캐시
    localStorage.setItem('rcm_nickname', data.nickname || user.displayName || '손님');

    // 일일 출석 보상 — runTransaction으로 조건+쓰기 원자 처리
    const d = new Date();
    const today = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let gotBonus = false;
    let finalTickets = data.tickets || 0;

    await runTransaction(db, async tx => {
      const txSnap = await tx.get(ref);
      if(!txSnap.exists()) throw new Error('user document missing');
      const txData = txSnap.data();
      if(txData.lastDailyLogin !== today){
        finalTickets = (txData.tickets || 0) + 5;
        tx.update(ref, { tickets: finalTickets, lastDailyLogin: today });
        gotBonus = true;
      } else {
        finalTickets = txData.tickets || 0;
        gotBonus = false;
      }
    });

    // 최신 tickets → localStorage 캐시 (가챠/빙고 UI 참조용)
    localStorage.setItem('rcm_gacha_tickets', finalTickets);
    showTickets(finalTickets);

    // 출석 보상 토스트
    if(gotBonus){
      const toast = document.createElement('div');
      toast.textContent = '오늘의 출석 보상! 가챠권 5개';
      toast.setAttribute('role','status');
      toast.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#4A3F3A;color:#FBF0D9;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;white-space:nowrap;font-family:inherit;';
      document.body.appendChild(toast);
      setTimeout(()=>{toast.style.transition='opacity .4s';toast.style.opacity='0';setTimeout(()=>toast.remove(),400);},3000);
    }
  } catch(e){
    // Firestore 실패 시 localStorage 기존 값 유지
  }
});

// 로그아웃
window.doLogout = async function(){
  await signOut(auth);
  location.href = 'login.html';
};
</script>
</body>
</html>
