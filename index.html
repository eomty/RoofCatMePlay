<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ROOF CAT ME PLAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    html { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rcm-red:   #E8392A;
      --rcm-red-light: #FF6B5B;
      --bg:        #FFF8F2;
      --surface:   #FFFFFF;
      --paw:       #FFE8E0;
      --text:      #2A1A14;
      --muted:     #9E7C70;
      --radius:    20px;
    }

    body {
      background: var(--bg);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* 배경 발바닥 무늬 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle 18px at 20% 15%, rgba(232,57,42,0.05) 100%, transparent 100%),
        radial-gradient(circle 10px at 23% 11%, rgba(232,57,42,0.05) 100%, transparent 100%),
        radial-gradient(circle 10px at 28% 11%, rgba(232,57,42,0.05) 100%, transparent 100%),
        radial-gradient(circle 18px at 75% 70%, rgba(232,57,42,0.04) 100%, transparent 100%),
        radial-gradient(circle 10px at 78% 66%, rgba(232,57,42,0.04) 100%, transparent 100%),
        radial-gradient(circle 10px at 83% 66%, rgba(232,57,42,0.04) 100%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* 헤더 */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 36px;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 200px;
      height: auto;
    }

    .play-badge {
      background: var(--rcm-red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 4px 14px;
      border-radius: 20px;
    }

    .tagline {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* 그리드 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 360px;
      position: relative;
      z-index: 1;
    }

    /* 카드 버튼 */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 2px 12px rgba(232,57,42,0.08), 0 1px 3px rgba(0,0,0,0.06);
      transition: transform 0.18s, box-shadow 0.18s;
      cursor: pointer;
      border: 2px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .card:active {
      transform: scale(0.96);
      box-shadow: 0 1px 6px rgba(232,57,42,0.1);
    }

    .card.escape {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: center;
      gap: 14px;
      padding: 22px 24px;
      background: linear-gradient(135deg, #2A1A14 0%, #3D2418 100%);
      color: #F5D97A;
      border-color: rgba(245,217,122,0.25);
    }

    .card.escape:active {
      transform: scale(0.97);
    }

    .icon {
      font-size: 36px;
      line-height: 1;
    }

    .card-label {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }

    .card-sub {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }

    .card.escape .card-label {
      color: #F5D97A;
      font-size: 16px;
    }

    .card.escape .card-sub {
      color: rgba(245,217,122,0.6);
    }

    /* 빙고 카드 강조색 */
    .card.bingo { border-color: #FFD6CC; }
    .card.dokan { border-color: #D6EED6; }
    .card.gacha { border-color: #D6E4FF; }
    .card.bti   { border-color: #F5E6FF; }

    .card.bingo:active, .card.dokan:active,
    .card.gacha:active, .card.bti:active {
      border-color: transparent;
    }

    .footer {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(158,124,112,0.5);
      text-align: center;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
