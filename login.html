<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
  <title>로그인 — ROOF CAT ME PLAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rcm-theme.css">
  <style>
    html{color-scheme:light;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#fff;color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    .page{width:100%;max-width:480px;margin:0 auto;padding:0 20px;flex:1;}

    .card{display:flex;flex-direction:column;gap:16px;padding:26px 0 40px;}

    /* 탭 */
    .tabs{display:flex;background:#F4EFE8;border-radius:12px;padding:4px;gap:4px;}
    .tab{flex:1;height:42px;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:none;color:var(--ink-soft);transition:background .2s;}
    .tab.active{background:#fff;color:var(--roof-text);box-shadow:0 0 0 1.5px var(--line);}
    .tab:focus-visible,.inp:focus-visible,.submit-btn:focus-visible,.google-btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}

    .tab-content{display:none;flex-direction:column;gap:12px;}
    .tab-content.active{display:flex;}

    /* 입력 */
    .inp{width:100%;height:50px;border:1.5px solid #D9CFC2;border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;}
    .inp:focus{border-color:var(--sky);outline:2px solid var(--sky);outline-offset:1px;}

    .submit-btn{width:100%;height:54px;background:var(--roof-btn);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
    .submit-btn:active{transform:scale(.98);}

    .divider{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:12.5px;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}

    /* 구글 버튼 */
    .google-btn{width:100%;height:54px;background:#fff;border:1.5px solid #D9CFC2;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;}
    .google-btn:active{transform:scale(.98);}
    .google-icon{width:20px;height:20px;}

    .error-msg{font-size:13px;color:var(--roof-text);text-align:center;min-height:16px;white-space:pre-line;}
    .loading{text-align:center;color:var(--ink-soft);font-size:13px;display:none;}
  </style>
</head>
<body>

<div class="rcm-hero">
  <img class="rcm-hero-logo" src="images/rcm-logo.png" alt="ROOF CAT ME">
  <span class="rcm-hero-badge">PLAY</span>
</div>

<div class="page">
<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">로그인</button>
    <button class="tab" onclick="switchTab('signup')">회원가입</button>
  </div>

  <!-- 로그인 탭 -->
  <div class="tab-content active" id="tab-login">
    <input class="inp" id="login-email" aria-label="이메일" type="email" placeholder="이메일" autocomplete="email">
    <input class="inp" id="login-pw" aria-label="비밀번호" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="error-msg" id="login-err"></div>
    <button class="submit-btn" onclick="doEmailLogin()">로그인</button>
    <div class="divider">또는</div>
    <button class="google-btn" onclick="doGoogleLogin()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google로 로그인
    </button>
  </div>

  <!-- 회원가입 탭 -->
  <div class="tab-content" id="tab-signup">
    <input class="inp" id="signup-nick" aria-label="닉네임" type="text" placeholder="닉네임 (최대 10자)" maxlength="10">
    <input class="inp" id="signup-email" aria-label="이메일" type="email" placeholder="이메일" autocomplete="email">
    <input class="inp" id="signup-pw" aria-label="비밀번호" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password">
    <div class="error-msg" id="signup-err"></div>
    <button class="submit-btn" onclick="doSignup()">회원가입</button>
    <div class="divider">또는</div>
    <button class="google-btn" onclick="doGoogleLogin()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google로 가입
    </button>
  </div>

  <div class="loading" id="loading">처리 중...</div>
</div>
</div>
<div class="rcm-roof"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
         onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {    apiKey: "AIzaSyBqxMZf8xDfaQ1oAheXJAuYbWBBfZBkgvI",
    authDomain: "roofcatmeplay.firebaseapp.com",
    projectId: "roofcatmeplay",
    storageBucket: "roofcatmeplay.firebasestorage.app",
    messagingSenderId: "793320259272",
    appId: "1:793320259272:web:7ba8355067b03edc2b2ffd" };
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// redirect 결과 확인 후 onAuthStateChanged 등록 (race condition 방지)
let authActionInProgress = false;

async function initAuth(){
  try{
    const result = await getRedirectResult(auth);
    if(result?.user){
      authActionInProgress = true;
      try{
        await saveUserDataWithRetry(result.user, null);
        location.href = 'index.html';
        return;
      } catch(e){
        await signOut(auth);
        authActionInProgress = false;
        errMsg('login-err','회원 정보 저장에 실패했습니다. 다시 로그인해주세요.');
      }
    }
  } catch(e){
    errMsg('login-err','Google 로그인 처리에 실패했습니다. 다시 시도해주세요.');
  }
  // redirect 결과 처리 완료 후 기존 로그인 감지 등록
  onAuthStateChanged(auth, user => {
    if(user && !authActionInProgress) location.href = 'index.html';
  });
}
initAuth();

window.switchTab = function(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='signup')));
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
};

let isLoading = false;
function setLoading(on){
  isLoading = on;
  document.getElementById('loading').style.display = on?'block':'none';
  document.querySelectorAll('.submit-btn,.google-btn').forEach(btn=>{
    btn.disabled = on;
    btn.style.opacity = on?'0.5':'1';
  });
}

function errMsg(id, msg){
  document.getElementById(id).textContent = msg;
}

async function saveUserDataWithRetry(user, nickname){
  try{
    await saveUserData(user, nickname);
  } catch(e){
    await new Promise(r=>setTimeout(r,800));
    await saveUserData(user, nickname); // 1회 재시도
  }
}

async function saveUserData(user, nickname){
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref, {
      nickname: nickname || user.displayName || '손님',
      email: user.email,
      createdAt: serverTimestamp(),
      tickets: 5, // 첫 가입 보너스
      collection: {},
      discovered: {}
    });
  }
}

window.doEmailLogin = async function(){
  if(isLoading) return;
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  if(!email||!pw){ errMsg('login-err','이메일과 비밀번호를 입력하세요.'); return; }
  setLoading(true); errMsg('login-err','');
  try{
    authActionInProgress = true;
    const cred = await signInWithEmailAndPassword(auth, email, pw);
    try{
      await saveUserData(cred.user, null);
      location.href = 'index.html';
    } catch(fsErr){
      await signOut(auth);
      authActionInProgress = false;
      errMsg('login-err','회원 정보 저장에 실패했습니다. 다시 시도해주세요.');
    }
  } catch(e){
    authActionInProgress = false;
    const msgs = {'auth/user-not-found':'등록된 이메일이 없어요.','auth/wrong-password':'비밀번호가 틀렸어요.','auth/invalid-credential':'이메일 또는 비밀번호를 확인하세요.'};
    errMsg('login-err', msgs[e.code]||'로그인 실패: '+e.message);
  } finally{ setLoading(false); }
};

window.doSignup = async function(){
  if(isLoading) return;
  const nick  = document.getElementById('signup-nick').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pw    = document.getElementById('signup-pw').value;
  if(!nick){ errMsg('signup-err','닉네임을 입력하세요.'); return; }
  if(!email||!pw){ errMsg('signup-err','이메일과 비밀번호를 입력하세요.'); return; }
  if(pw.length<6){ errMsg('signup-err','비밀번호는 6자 이상이어야 해요.'); return; }
  setLoading(true); errMsg('signup-err','');
  try{
    authActionInProgress = true;
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    try{
      await saveUserDataWithRetry(cred.user, nick);
      location.href = 'index.html';
    } catch(fsErr){
      // Auth 계정은 생성됨 — 로그인 후 자동 복구됨
      await signOut(auth);
      authActionInProgress = false;
      errMsg('signup-err','계정은 생성됐으나 정보 저장에 실패했습니다.\n로그인 탭에서 로그인해주세요.');
    }
  } catch(e){
    authActionInProgress = false;
    const msgs = {'auth/email-already-in-use':'이미 사용 중인 이메일이에요.','auth/weak-password':'비밀번호가 너무 약해요.'};
    errMsg('signup-err', msgs[e.code]||'회원가입 실패: '+e.message);
  } finally{ setLoading(false); }
};

window.doGoogleLogin = async function(){
  if(isLoading) return;
  setLoading(true);
  try{
    authActionInProgress = true;
    const provider = new GoogleAuthProvider();
    let cred;
    try{
      cred = await signInWithPopup(auth, provider);
    } catch(popupErr){
      // 팝업 실패(모바일 인앱 브라우저 등) → redirect 방식으로 전환
      if(popupErr.code==='auth/popup-blocked'){
        await signInWithRedirect(auth, provider);
        return; // redirect 후 페이지 이동하므로 여기서 종료
      }
      if(popupErr.code==='auth/popup-closed-by-user'){
        authActionInProgress = false;
        setLoading(false);
        return; // 사용자가 직접 닫은 경우 — 아무 동작 없이 종료
      }
      throw popupErr;
    }
    try{
      await saveUserData(cred.user, null);
      location.href = 'index.html';
    } catch(fsErr){
      await signOut(auth);
      authActionInProgress = false;
      errMsg('login-err','회원 정보 저장에 실패했습니다. 다시 시도해주세요.');
      errMsg('signup-err','회원 정보 저장에 실패했습니다. 다시 시도해주세요.');
    }
  } catch(e){
    authActionInProgress = false;
    errMsg('login-err','Google 로그인 실패. 다시 시도해주세요.');
    errMsg('signup-err','Google 로그인 실패. 다시 시도해주세요.');
  } finally{ setLoading(false); }
};

// 엔터키 지원
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter'||isLoading) return;
  if(document.getElementById('tab-login').classList.contains('active')) window.doEmailLogin();
  else window.doSignup();
});
</script>
</body>
</html>
