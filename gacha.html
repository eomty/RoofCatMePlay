<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>냥가챠 — ROOF CAT ME PLAY</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    html{color-scheme:light;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--red:#E8392A;--bg:#FFF8F2;--text:#2A1A14;--muted:#9E7C70;}
    body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:60px;}

    .hdr{width:100%;background:var(--red);color:#fff;padding:20px;text-align:center;}
    .hdr-brand{font-size:11px;letter-spacing:.15em;opacity:.75;margin-bottom:4px;}
    .hdr-title{font-size:26px;font-weight:900;}
    .hdr-nick{font-size:13px;opacity:.85;margin-top:3px;}

    .ticket-box{margin:24px 0 8px;text-align:center;}
    .ticket-label{font-size:13px;color:var(--muted);margin-bottom:6px;}
    .ticket-count{font-size:40px;font-weight:900;color:var(--text);}
    .ticket-unit{font-size:14px;color:var(--muted);margin-left:4px;}

    .pull-btns{display:flex;gap:12px;padding:16px;width:100%;max-width:360px;}
    .pull-btn{flex:1;padding:18px 0;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s;-webkit-tap-highlight-color:transparent;}
    .pull-btn:active{transform:scale(.96);}
    .pull-btn.one{background:#fff;color:var(--red);border:2px solid var(--red);}
    .pull-btn.ten{background:var(--red);color:#fff;}
    .pull-btn .cost{font-size:11px;font-weight:400;opacity:.7;display:block;margin-top:2px;}

    .divider{width:calc(100% - 32px);border:none;border-top:1px solid rgba(158,124,112,.15);margin:8px 0;}

    .rates-box{width:100%;max-width:360px;padding:4px 16px 12px;}
    .rates-title{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:700;}
    .rates{display:flex;gap:8px;flex-wrap:wrap;}
    .rate-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;}

    /* 합성 섹션 */
    .merge-section{width:100%;max-width:360px;padding:4px 16px 12px;}
    .merge-open-btn{width:100%;padding:14px;background:#fff;border:2px solid rgba(158,124,112,.3);border-radius:14px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit;}
    .merge-open-btn:active{transform:scale(.97);}

    .coll-btn{margin-top:8px;background:none;border:1.5px solid rgba(158,124,112,.3);border-radius:20px;color:var(--muted);font-size:13px;padding:10px 24px;cursor:pointer;font-family:inherit;}

    /* 공통 오버레이 */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;}
    .overlay.open{display:flex;}

    /* 뽑기 결과 */
    .result-title{color:#fff;font-size:18px;font-weight:900;}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
    .multi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:400px;}
/* ── 등급별 카드 디자인 ───────────────────────────── */
.card-C .card-photo{background:linear-gradient(180deg,#424242,#616161);}
.card-C .card-info{background:#757575;}
.card-C .card-frame{border:2px solid #9E9E9E;}
.card-C .grade-badge{background:rgba(255,255,255,.15);color:#e0e0e0;}

.card-B .card-photo{background:linear-gradient(180deg,#1B5E20,#388E3C);}
.card-B .card-info{background:#388E3C;}
.card-B .card-frame{border:2px solid #66BB6A;}
.card-B .grade-badge{background:rgba(255,255,255,.15);color:#C8E6C9;}

.card-A .card-photo{background:linear-gradient(180deg,#0D47A1,#1565C0);}
.card-A .card-info{background:#1565C0;}
.card-A .card-frame{border:2px solid #42A5F5;box-shadow:0 0 10px rgba(66,165,245,.35);}
.card-A .grade-badge{background:rgba(255,255,255,.15);color:#BBDEFB;}

.card-S .card-photo{background:linear-gradient(180deg,#4A148C,#6A1B9A);}
.card-S .card-info{background:#6A1B9A;}
.card-S .card-frame{border:2px solid #CE93D8;animation:pulseS 2s ease-in-out infinite;}
.card-S .grade-badge{background:rgba(255,255,255,.15);color:#E1BEE7;}
@keyframes pulseS{0%,100%{box-shadow:0 0 10px rgba(206,147,216,.5)}50%{box-shadow:0 0 22px rgba(206,147,216,.9)}}

.card-SS .card-photo{background:linear-gradient(160deg,#b71c1c,#e65100,#f57f17,#1b5e20,#0d47a1,#4a148c);}
.card-SS .card-info{background:linear-gradient(90deg,#b71c1c,#e65100,#f9a825,#1b5e20,#0d47a1,#6a1b9a);}
.card-SS .card-frame{border:2px solid transparent;background:linear-gradient(#0d1117,#0d1117) padding-box,linear-gradient(135deg,#ff6b6b,#ffd700,#4caf50,#42a5f5,#ce93d8,#ff6b6b) border-box;}

.card-shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shimmer 3s ease-in-out infinite;pointer-events:none;}
@keyframes shimmer{0%{left:-100%}40%,100%{left:200%}}
.card-stars{position:absolute;top:8px;right:8px;display:flex;gap:2px;}

.card-star:nth-child(2){animation-delay:.3s;}
.card-star:nth-child(3){animation-delay:.6s;}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* 공통 카드 구조 */
.single-card{width:160px;height:220px;border-radius:20px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:popIn .4s ease;-webkit-tap-highlight-color:transparent;}

.mini-new{position:absolute;top:4px;left:4px;width:8px;height:8px;background:#FF6B6B;border-radius:50%;}

    .close-btn{background:#fff;border:none;border-radius:12px;padding:14px 40px;font-size:16px;font-weight:700;cursor:pointer;color:var(--text);font-family:inherit;}

    /* 합성 모달 */
    .merge-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:flex-end;justify-content:center;}
    .merge-overlay.open{display:flex;}
    .merge-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px 20px 44px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:hidden;}
    .merge-handle{width:36px;height:4px;background:#e0d8d4;border-radius:2px;align-self:center;}
    .merge-sheet-title{font-size:17px;font-weight:900;color:var(--text);text-align:center;}
    .merge-desc{font-size:12px;color:var(--muted);text-align:center;}

    /* 등급 탭 */
    .grade-tabs{display:flex;gap:8px;padding:0 4px;}
    .grade-tab{flex:1;padding:8px 0;border:2px solid transparent;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:#f2ece8;color:var(--muted);}
    .grade-tab.active{color:#fff;}

    /* 선택 카운터 */
    .merge-counter{text-align:center;font-size:13px;font-weight:700;color:var(--muted);}
    .merge-counter span{color:var(--red);}

    /* 합성 카드 그리드 */
    .merge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow-y:auto;padding:4px 2px;}
    .mc{border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:#f2ece8;border:2px solid transparent;-webkit-tap-highlight-color:transparent;transition:transform .12s;}
    .mc:active{transform:scale(.93);}
    .mc.selected{border-color:var(--red);background:#fff5f4;}
    .mc.exhausted{opacity:.35;cursor:default;}
    .mc-emoji{font-size:20px;}
    .mc-name{font-size:10px;font-weight:700;color:var(--text);text-align:center;}
    .mc-have{font-size:10px;color:var(--muted);text-align:center;}
    .mc-sel-badge{font-size:10px;font-weight:900;color:var(--red);}

    .merge-confirm-btn{padding:14px;background:var(--red);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
    .merge-confirm-btn:disabled{background:#e0d8d4;color:#9E7C70;cursor:default;}
    .merge-cancel-btn{padding:12px;background:none;border:1.5px solid #e0d8d4;border-radius:10px;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;}

    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#2A1A14;color:#fff;padding:14px 24px;border-radius:24px;font-size:14px;font-weight:700;z-index:2000;transition:transform .4s;white-space:nowrap;pointer-events:none;}
    .toast.show{transform:translateX(-50%) translateY(0);}
  </style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqxMZf8xDfaQ1oAheXJAuYbWBBfZBkgvI",
  authDomain: "roofcatmeplay.firebaseapp.com",
  projectId: "roofcatmeplay",
  storageBucket: "roofcatmeplay.firebasestorage.app",
  messagingSenderId: "793320259272",
  appId: "1:793320259272:web:7ba8355067b03edc2b2ffd"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const CATS = ['금동','금별','금실','낑깡','닉','달이','랑이','랭이','레오','레첼',
              '먼지','모아','모찌','무디','뭉이','백설','버즈','베리','부엉','블루',
              '비니','샤인','소고','시니','실버','써클','앤디','엘크','여비','절미',
              '주디','지니','치즈','콩떡','쿠미','티코','파인','페너','플래시','호떡','호시']
             .sort((a,b)=>a.localeCompare(b,'ko'));

const CAT_SLUG = {'금동':'geumdong','금별':'geumbyeol','금실':'geumsil','낑깡':'kkingkang','닉':'nik','달이':'dari','랑이':'rangi','랭이':'raengi','레오':'leo','레첼':'rechel','먼지':'meonji','모아':'moa','모찌':'mocchi','무디':'mudi','뭉이':'mungyi','백설':'baekseol','버즈':'beojeu','베리':'beri','부엉':'bueong','블루':'beullyu','비니':'bini','샤인':'shayin','소고':'sogo','시니':'shini','실버':'silbeo','써클':'sseokeul','앤디':'aendi','엘크':'elkeuri','여비':'yeobi','절미':'jeolmi','주디':'judi','지니':'jini','치즈':'chijeu','콩떡':'kongddeok','쿠미':'kumi','티코':'tikko','파인':'pain','페너':'fener','플래시':'peullaeswi','호떡':'hotteok','호시':'hoshi'};
const GRADES = ['C','B','A','S','SS'];
const GRADE_COLORS = {C:'linear-gradient(135deg,#757575,#9E9E9E)',B:'linear-gradient(135deg,#388E3C,#66BB6A)',A:'linear-gradient(135deg,#1565C0,#42A5F5)',S:'linear-gradient(135deg,#6A1B9A,#BA68C8)',SS:'linear-gradient(135deg,#F57F17,#FFD54F)'};
const GRADE_TEXT   = {C:'#fff',B:'#fff',A:'#fff',S:'#fff',SS:'#FFD700'};

let userRef    = null;
let tickets    = 0;
let collection = {};
let discovered = {};
let isLoading  = false;

// 합성 모달 상태
var mergeGrade = 'C';
var selCount   = {};
let isMerging  = false;

// ── 초기화 ──────────────────────────────────────────────────────
function init(){
  onAuthStateChanged(auth, async user => {
    if(!user){ location.href='login.html'; return; }
    userRef = doc(db,'users',user.uid);
    await loadUserData();
  });
}

async function loadUserData(){
  try{
    const snap = await getDoc(userRef);
    if(!snap.exists()){ showToast('사용자 정보를 불러오지 못했어요.'); return; }
    const data = snap.data();
    tickets    = data.tickets    || 0;
    collection = data.collection || {};
    discovered = data.discovered || {};
    const nick = data.nickname || '손님';
    document.getElementById('hdr-nick').textContent = nick + '님의 가챠';
    localStorage.setItem('rcm_nickname', nick);
    updateTicketUI();
  } catch(e){
    showToast('데이터 로드 실패: '+e.message);
  }
}

function updateTicketUI(){
  document.getElementById('ticket-count').textContent = tickets;
}

// ── 뽑기 ────────────────────────────────────────────────────────
function drawOne(){
  const r=Math.random()*100;
  let grade;
  if(r<1)       grade='SS';
  else if(r<5)  grade='S';
  else if(r<20) grade='A';
  else if(r<50) grade='B';
  else           grade='C';
  const cat=CATS[Math.floor(Math.random()*CATS.length)];
  return {cat,grade};
}

window.doPull = async function(count){
  if(isLoading) return;
  if(tickets < count){ showToast('가챠권이 부족해요! 냥빙고를 도전해보세요 🎯'); return; }
  isLoading = true;

  // 결과 미리 생성 (랜덤, Firestore 불필요)
  const results = [];
  for(let i=0;i<count;i++) results.push(drawOne());

  let newFlags = [];
  let committedTickets, committedColl, committedDisc;
  try{
    await runTransaction(db, async tx => {
      const snap = await tx.get(userRef);
      if(!snap.exists()) throw new Error('NO_USER');
      const data = snap.data();
      if((data.tickets||0) < count) throw new Error('INSUFFICIENT_TICKETS');

      const currDisc = data.discovered || {};
      const seen = new Set();
      newFlags = results.map(r=>{
        const key=r.cat+'_'+r.grade;
        const isN=!currDisc[key]&&!seen.has(key);
        seen.add(key); return isN;
      });

      const newColl = {...(data.collection||{})};
      const newDisc = {...currDisc};
      results.forEach(r=>{
        const key=r.cat+'_'+r.grade;
        newColl[key]=(newColl[key]||0)+1;
        newDisc[key]=true;
      });

      // 임시 변수에만 저장 (commit 성공 후 적용)
      committedTickets = data.tickets - count;
      committedColl    = newColl;
      committedDisc    = newDisc;

      tx.update(userRef,{
        tickets: committedTickets,
        collection: newColl,
        discovered: newDisc
      });
    });

    // commit 성공 후 로컬 상태 반영
    tickets    = committedTickets;
    collection = committedColl;
    discovered = committedDisc;
    updateTicketUI();
    localStorage.setItem('rcm_gacha_tickets', tickets);
    showResults(results, newFlags, count);
  } catch(e){
    isLoading=false;
    if(e.message==='INSUFFICIENT_TICKETS') showToast('가챠권이 부족해요!');
    else showToast('오류가 발생했습니다. 다시 시도해주세요.');
    return;
  }
  isLoading=false;
};

// ── 카드 렌더링 ──────────────────────────────────────────────────
function makeCardHTML(r, isN, size, delay){
  const ss = r.grade==='SS';
  const slug = CAT_SLUG[r.cat]||r.cat;
  const baseImg='images/cats/'+slug+'.webp';
  const ssImg='images/cats/ss/'+slug+'.webp';
  const imgSrc=ss?ssImg:baseImg;
  const onerr=ss
    ? "this.src='"+baseImg+"';this.onerror=function(){this.style.display='none';this.parentNode.innerHTML+='🐱';};"
    : "this.style.display='none';this.parentNode.innerHTML+='🐱';";
  const imgH=size==='single'?'140px':'60%';
  const shimmer=ss?'<div class="card-shimmer"></div><div class="card-stars"><span class="card-star">✦</span><span class="card-star">✦</span><span class="card-star">✦</span></div>':'';
  const newBadge=(isN&&size==='single')?'<div class="card-new-badge">NEW</div>':'';
  const miniNew=(isN&&size==='mini')?'<div class="mini-new"></div>':'';
  return `<div class="${size==='single'?'single-card':'mini-card'} card-${r.grade}" style="${size==='mini'&&delay?'animation-delay:'+delay+'s':''}">      <div class="card-frame"></div>${shimmer}${newBadge}${miniNew}      <div class="card-photo" style="height:${imgH};padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;">        <img src="${imgSrc}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;" onerror="${onerr}">      </div>      <div class="card-info"><div class="cat-name">${r.cat}</div><div class="grade-badge">${r.grade}</div></div>    </div>`;
}

function showResults(results, newFlags, count){
  const area=document.getElementById('result-area');
  const title=document.getElementById('result-title');
  if(count===1){
    const r=results[0],isN=newFlags[0];
    title.textContent=gradeLabel(r.grade);
    area.innerHTML=makeCardHTML(r,isN,'single');
  }else{
    const hasSpecial=results.some(r=>r.grade==='S'||r.grade==='SS');
    title.textContent=hasSpecial?'✨ 특별한 카드 등장!':`${count}장 획득!`;
    area.innerHTML=`<div class="multi-grid">${results.map((r,i)=>makeCardHTML(r,newFlags[i],'mini',i*.05)).join('')}</div>`;
  }
  document.getElementById('overlay').classList.add('open');
}

function gradeLabel(g){
  return {C:'일반 카드 획득',B:'희귀 카드 획득!',A:'✨ 레어 카드!',S:'💜 슈퍼 레어!',SS:'🌟 초희귀 등장!!'}[g];
}

window.closeResult = function(){
  document.getElementById('overlay').classList.remove('open');
};

// ── 합성 ─────────────────────────────────────────────────────────
window.openMergeModal = function(){
  selCount={};
  buildGradeTabs();
  setMergeGrade('C');
  document.getElementById('merge-overlay').classList.add('open');
};

function closeMergeModal(){
  document.getElementById('merge-overlay').classList.remove('open');
}
window.closeMergeModal = closeMergeModal;

function handleMergeOverlayClick(e){
  if(e.target===document.getElementById('merge-overlay')) closeMergeModal();
}
window.handleMergeOverlayClick = handleMergeOverlayClick;

function buildGradeTabs(){
  const tabs=document.getElementById('grade-tabs');
  tabs.innerHTML='';
  ['C','B','A','S'].forEach(g=>{
    const btn=document.createElement('button');
    btn.className='grade-tab'; btn.id='mtab-'+g;
    btn.textContent=g; btn.style.background=GRADE_COLORS[g];
    btn.onclick=()=>setMergeGrade(g);
    tabs.appendChild(btn);
  });
}

function setMergeGrade(g){
  mergeGrade=g; selCount={};
  document.querySelectorAll('.grade-tab').forEach(b=>b.classList.remove('active'));
  const tab=document.getElementById('mtab-'+g);
  if(tab) tab.classList.add('active');
  renderMergeGrid();
  updateMergeCounter();
}

function totalSel(){
  return Object.values(selCount).reduce((s,v)=>s+v,0);
}

function renderMergeGrid(){
  const grid=document.getElementById('merge-grid');
  grid.innerHTML='';
  const total=totalSel();
  CATS.forEach(cat=>{
    const have=collection[cat+'_'+mergeGrade]||0;
    if(have===0) return;
    const sel=selCount[cat]||0;
    const canAdd=sel<have&&total<3;
    const exhausted=!canAdd&&sel===0;
    const card=document.createElement('div');
    card.className='mc'+(sel>0?' selected':'')+(exhausted?' exhausted':'');
    card.innerHTML=`<div class="mc-emoji">🐱</div><div class="mc-name">${cat}</div><div class="mc-have">보유 ${have}장</div>${sel>0?`<div class="mc-sel-badge">${sel}선택</div>`:''}`;
    if(!exhausted) card.addEventListener('click',()=>toggleSel(cat));
    grid.appendChild(card);
  });
  if(grid.children.length===0){
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:20px 0;">${mergeGrade}등급 카드가 없어요</div>`;
  }
}

function toggleSel(cat){
  const have=collection[cat+'_'+mergeGrade]||0;
  const sel=selCount[cat]||0;
  const total=totalSel();
  const next=sel+1;
  if(next>have||(total>=3&&next>sel)){ delete selCount[cat]; }
  else{ selCount[cat]=next; }
  renderMergeGrid();
  updateMergeCounter();
}

function updateMergeCounter(){
  const t=totalSel();
  document.getElementById('sel-count').textContent=t;
  document.getElementById('merge-confirm-btn').disabled=t!==3;
}

window.confirmMerge = async function(){
  if(isMerging||totalSel()!==3) return;
  const nextGrade=GRADES[GRADES.indexOf(mergeGrade)+1];
  if(!nextGrade){ showToast('이미 최고 등급이에요!'); return; }

  isMerging=true;
  document.getElementById('merge-confirm-btn').disabled=true;

  const resultCat=CATS[Math.floor(Math.random()*CATS.length)];
  let resultIsNew=false;
  let committedMergeColl, committedMergeDisc;

  try{
    await runTransaction(db, async tx=>{
      const snap=await tx.get(userRef);
      if(!snap.exists()) throw new Error('NO_USER');
      const data=snap.data();
      const newColl={...(data.collection||{})};

      // 보유 검증 (트랜잭션 내에서 재확인)
      let total=0;
      for(const [cat,cnt] of Object.entries(selCount)){
        const have=newColl[cat+'_'+mergeGrade]||0;
        if(have<cnt) throw new Error('INSUFFICIENT_CARDS');
        total+=cnt;
      }
      if(total!==3) throw new Error('INVALID_SELECTION');

      // 소비
      for(const [cat,cnt] of Object.entries(selCount)){
        const key=cat+'_'+mergeGrade;
        newColl[key]=(newColl[key]||0)-cnt;
        if(newColl[key]<=0) delete newColl[key];
      }

      // 결과 카드 추가
      const resultKey=resultCat+'_'+nextGrade;
      newColl[resultKey]=(newColl[resultKey]||0)+1;
      const newDisc={...(data.discovered||{})};
      resultIsNew=!newDisc[resultKey];
      newDisc[resultKey]=true;

      // 임시 변수에만 저장 (commit 성공 후 적용)
      tx.update(userRef,{collection:newColl,discovered:newDisc});
      committedMergeColl = newColl;
      committedMergeDisc = newDisc;
    });

    // commit 성공 후 로컬 상태 반영
    collection = committedMergeColl;
    discovered = committedMergeDisc;
    closeMergeModal();
    showResults([{cat:resultCat,grade:nextGrade}],[resultIsNew],1);
    document.getElementById('result-title').textContent='🔮 합성 성공! '+gradeLabel(nextGrade);
  }catch(e){
    closeMergeModal();
    if(e.message==='INSUFFICIENT_CARDS') showToast('카드가 부족해요. 다시 선택해주세요.');
    else showToast('합성 오류가 발생했습니다.');
  }finally{
    isMerging=false;
  }
};

window.addTestTickets = async function(){
  if(!userRef){ showToast('로그인 정보 없음'); return; }
  let committedTickets;
  try{
    await runTransaction(db, async tx=>{
      const snap = await tx.get(userRef);
      if(!snap.exists()) throw new Error('NO_USER');
      committedTickets = (snap.data().tickets||0) + 10;
      tx.update(userRef,{ tickets: committedTickets });
    });
    tickets = committedTickets;
    localStorage.setItem('rcm_gacha_tickets', tickets);
    updateTicketUI();
    showToast('🛠 테스트 +10장 (Firestore)');
  } catch(e){
    showToast('테스트 지급 실패: '+e.message);
  }
};

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

init();
</script>
</body>
</html>
