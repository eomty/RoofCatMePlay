<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>냥가챠 — ROOF CAT ME PLAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rcm-theme.css">
  <style>
    html{color-scheme:light;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#fff;color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
    .wrap{width:100%;max-width:480px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:22px;}
    .nick{font-size:14px;color:var(--ink-soft);padding-top:20px;margin-bottom:-8px;}

    /* 보유 가챠권 */
    .ticket{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:var(--ivory);border:1.5px solid var(--gold);}
    .ticket svg{flex-shrink:0;}
    .t-label{font-size:13px;color:var(--ink-soft);}
    .t-count{font-family:var(--font-display);font-size:38px;line-height:1.1;color:var(--roof);}
    .t-count small{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;color:var(--ink-soft);margin-left:4px;}

    /* 뽑기 버튼 */
    .pull-btns{display:flex;gap:12px;}
    .pull-btns .rcm-btn{height:68px;flex-direction:column;gap:2px;}
    .pull-btns .cost{font-size:12px;font-weight:500;opacity:.85;}

    /* 확률 */
    .sec-title{margin-bottom:12px;}
    .rates{list-style:none;display:flex;justify-content:space-between;gap:6px;}
    .rates li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:12px;background:#F4EFE8;}
    .rates .pct{font-size:13px;font-weight:800;color:var(--ink);}
    .rate-note{margin-top:10px;font-size:12px;color:var(--ink-soft);line-height:1.5;word-break:keep-all;}

    /* 합성 / 링크 */
    .merge-open{height:auto;min-height:60px;padding:12px 16px;flex-direction:column;gap:2px;}
    .merge-open small{font-size:12px;font-weight:500;color:var(--ink-soft);}
    .links{display:flex;flex-direction:column;gap:10px;}
    .dev{align-self:center;background:none;border:1.5px dashed var(--stone);border-radius:999px;color:var(--ink-soft);font-size:12px;padding:7px 18px;cursor:pointer;font-family:inherit;}
    .foot{padding:6px 0 22px;text-align:center;font-size:12px;color:var(--ink-soft);}

    /* 공통 오버레이 (뽑기 결과) */
    .overlay{display:none;position:fixed;inset:0;background:rgba(40,28,22,.78);z-index:1000;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:18px;overflow:auto;}
    .overlay.open{display:flex;}
    #result-area{width:100%;display:flex;justify-content:center;}
    .result-title{font-family:var(--font-display);font-size:26px;color:var(--ivory);text-align:center;}
    .overlay .rcm-btn{width:auto;min-width:160px;padding:0 36px;}

    /* 결과 카드 (.nc 재사용) */
    .nc.rs{cursor:default;animation:popIn .4s ease both;}
    .nc.rs:active{transform:none;}
    .nc.single{width:210px;}
    .nc.single .ph{height:200px;}
    .nc.single .nm{font-size:21px;}
    .nc.single .meta{min-height:32px;padding:0 38px;}
    .nc.single .stamp{width:32px;height:32px;font-size:16px;}
    .new-tag{position:absolute;top:8px;left:8px;z-index:2;padding:2px 9px;border-radius:999px;background:var(--roof-btn);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;}
    .multi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:calc(100% + 16px);max-width:400px;}
    .nc.mini{border-radius:10px;}
    .nc.mini .in{padding:4px 4px 6px;gap:4px;}
    .nc.mini .ph{height:auto;aspect-ratio:1/1;border-radius:7px;}
    .nc.mini .ph svg{width:26px;height:26px;}
    .nc.mini .nm{font-size:10.5px;line-height:1.25;text-align:center;letter-spacing:-.03em;word-break:keep-all;overflow-wrap:anywhere;}
    .nc.mini .meta{min-height:14px;padding:0;}
    .nc.mini .stamp{left:0;width:14px;height:14px;font-size:8px;}
    .nc.mini .meta.long{flex-direction:column;gap:3px;}
    .nc.mini .meta.long .stamp{position:static;transform:none;}
    .new-dot{position:absolute;top:4px;left:4px;z-index:2;width:10px;height:10px;border-radius:50%;background:var(--roof-btn);border:2px solid #fff;}
    @keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){.nc.rs{animation:none;}}

    /* 합성 모달 */
    .merge-overlay{display:none;position:fixed;inset:0;background:rgba(40,28,22,.55);z-index:1000;align-items:flex-end;justify-content:center;}
    .merge-overlay.open{display:flex;}
    .merge-sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:14px 20px 28px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:hidden;}
    .merge-handle{width:36px;height:4px;background:#E0D8D4;border-radius:2px;align-self:center;}
    .merge-sheet-title{font-size:20px;font-weight:800;color:var(--roof);text-align:center;}
    .merge-desc{font-size:13px;color:var(--ink-soft);text-align:center;word-break:keep-all;}
    .grade-tabs{display:flex;gap:8px;}
    .grade-tab{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-family:var(--font-display);font-size:19px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .grade-tab:focus-visible,.mc:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}
    .grade-tab.active{box-shadow:inset 0 -3px 0 currentColor;}
    .grade-tab.active.C{background:#F4EFE8;border-color:#A79C92;color:#4A3F3A;}
    .grade-tab.active.B{background:#EEF7FA;border-color:#8EC5D6;color:#1F4B5A;}
    .grade-tab.active.A{background:#FFF3EA;border-color:#E4572E;color:#B8321D;}
    .grade-tab.active.S{background:#FBF0D9;border:2px solid #B8321D;color:#B8321D;}
    .merge-counter{text-align:center;font-size:14px;font-weight:700;color:var(--ink-soft);}
    .merge-counter span{color:var(--roof-text);font-size:16px;}
    .merge-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow-y:auto;padding:4px 2px;}
    .mc{border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:#F4EFE8;border:2px solid transparent;-webkit-tap-highlight-color:transparent;transition:transform .12s;}
    .mc:active{transform:scale(.95);}
    .mc.selected{border-color:var(--roof-btn);background:#FFF3EA;}
    .mc.exhausted{opacity:.4;cursor:default;}
    .mc-emoji{display:flex;}
    .mc-name{font-size:12px;font-weight:700;color:var(--ink);text-align:center;word-break:keep-all;overflow-wrap:anywhere;}
    .mc-have{font-size:11px;color:var(--ink-soft);text-align:center;}
    .mc-sel-badge{font-size:11px;font-weight:800;color:var(--roof-text);}
    .merge-cancel-btn{height:46px;background:none;border:1.5px solid var(--line);border-radius:12px;font-size:14px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}

    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#4A3F3A;color:#FBF0D9;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:2000;transition:transform .4s,opacity .4s;opacity:0;white-space:nowrap;pointer-events:none;max-width:92vw;overflow:hidden;text-overflow:ellipsis;}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  </style>
</head>
<body>

<div class="rcm-hero"><h1 class="rcm-hero-title">냥가챠</h1><img class="rcm-hero-cast walk" src="images/gacha-walk.png" alt="" width="360" height="450"></div>

<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqxMZf8xDfaQ1oAheXJAuYbWBBfZBkgvI",
  authDomain: "roofcatmeplay.firebaseapp.com",
  projectId: "roofcatmeplay",
  storageBucket: "roofcatmeplay.firebasestorage.app",
  messagingSenderId: "793320259272",
  appId: "1:793320259272:web:7ba8355067b03edc2b2ffd"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const CATS = ['금동','금별','금실','낑깡','닉','달이','랑이','랭이','레오','레첼',
              '먼지','모아','모찌','무디','뭉이','백설','버즈','베리','부엉','블루',
              '비니','샤인','소고','시니','실버','써클','앤디','엘크','여비','연탄',
              '온별','절미','주디','지니','치즈','콩떡','쿠미','티코','파인','페너',
              '플래시','호떡','호시']
             .sort((a,b)=>a.localeCompare(b,'ko'));

const SS_CATS = ['먼지킨','배부른절미','버즈소고','샤인여비','써클2','어린낑깡',
                 '어린엘크','어린페너','유혹샤인','자는버즈','자는치즈','콩떡랭이',
                 '탈옥백설','페너앤디','호시확대'];

const CAT_SLUG = {
  '금동':'geumdong','금별':'geumbyeol','금실':'geumsil','낑깡':'kkingkang',
  '닉':'nik','달이':'dari','랑이':'rangi','랭이':'raengi','레오':'leo','레첼':'rechel',
  '먼지':'meonji','모아':'moa','모찌':'mocchi','무디':'mudi','뭉이':'mungyi',
  '백설':'baekseol','버즈':'buzz','베리':'berry','부엉':'buweong','블루':'blue',
  '비니':'bini','샤인':'shine','소고':'sogo','시니':'shini','실버':'silver',
  '써클':'circle','앤디':'andy','엘크':'elk','여비':'yeobi','연탄':'yeontan',
  '온별':'onbyeol','절미':'jeolmi','주디':'judi','지니':'jini','치즈':'cheese',
  '콩떡':'kongddeok','쿠미':'kumi','티코':'tico','파인':'pine','페너':'fenner',
  '플래시':'flash','호떡':'hotteok','호시':'hosi',
  '먼지킨':'meonji_kin','배부른절미':'jeolmi_fat','버즈소고':'buzz_sogo',
  '샤인여비':'shine_yeobi','써클2':'circle2','어린낑깡':'kkingkang_baby',
  '어린엘크':'elk_baby','어린페너':'fenner_baby','유혹샤인':'shine_seduce',
  '자는버즈':'buzz_sleep','자는치즈':'cheese_sleep','콩떡랭이':'kongddeok_raengi',
  '탈옥백설':'baekseol_escape','페너앤디':'fenner_andy','호시확대':'hosi_zoom'
};
const GRADES = ['C','B','A','S','SS'];
const GRADE_NAMES = {C:'일반',B:'희귀',A:'레어',S:'슈퍼 레어',SS:'초희귀'};
const ICON_CAT = '<svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="rgba(74,63,58,.38)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M10 22 L12 7 L22 14 Q24 13.6 26 14 L36 7 L38 22 Q40 33 24 40 Q8 33 10 22Z"/><circle cx="18" cy="24" r="1.6"/><circle cx="30" cy="24" r="1.6"/><path d="M22 29 h4"/></svg>';
const ICON_CAT_S = '<svg width="24" height="24" viewBox="0 0 48 48" fill="none" stroke="#8B8077" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M10 22 L12 7 L22 14 Q24 13.6 26 14 L36 7 L38 22 Q40 33 24 40 Q8 33 10 22Z"/><circle cx="18" cy="24" r="1.6"/><circle cx="30" cy="24" r="1.6"/></svg>';

let userRef    = null;
let tickets    = 0;
let collection = {};
let discovered = {};
let isLoading  = false;

// 합성 모달 상태
var mergeGrade = 'C';
var selCount   = {};
let isMerging  = false;

// ── 초기화 ──────────────────────────────────────────────────────
function init(){
  onAuthStateChanged(auth, async user => {
    if(!user){ location.href='login.html'; return; }
    userRef = doc(db,'users',user.uid);
    await loadUserData();
  });
}

async function loadUserData(){
  try{
    const snap = await getDoc(userRef);
    if(!snap.exists()){ showToast('사용자 정보를 불러오지 못했어요.'); return; }
    const data = snap.data();
    tickets    = data.tickets    || 0;
    collection = data.collection || {};
    discovered = data.discovered || {};
    const nick = data.nickname || '손님';
    document.getElementById('hdr-nick').textContent = nick + '님의 가챠';
    localStorage.setItem('rcm_nickname', nick);
    updateTicketUI();
  } catch(e){
    showToast('데이터 로드 실패: '+e.message);
  }
}

function updateTicketUI(){
  document.getElementById('ticket-count').textContent = tickets;
}

// ── 뽑기 ────────────────────────────────────────────────────────
function drawOne(){
  const r=Math.random()*100;
  let grade;
  if(r<1)       grade='SS';
  else if(r<5)  grade='S';
  else if(r<20) grade='A';
  else if(r<50) grade='B';
  else           grade='C';
  const pool = grade==='SS' ? [...CATS,...SS_CATS] : CATS;
  const cat  = pool[Math.floor(Math.random()*pool.length)];
  return {cat,grade};
}

window.doPull = async function(count){
  if(isLoading) return;
  if(tickets < count){ showToast('가챠권이 부족해요! 냥빙고에 도전해보세요'); return; }
  isLoading = true;

  // 결과 미리 생성 (랜덤, Firestore 불필요)
  const results = [];
  for(let i=0;i<count;i++) results.push(drawOne());

  let newFlags = [];
  let committedTickets, committedColl, committedDisc;
  try{
    await runTransaction(db, async tx => {
      const snap = await tx.get(userRef);
      if(!snap.exists()) throw new Error('NO_USER');
      const data = snap.data();
      if((data.tickets||0) < count) throw new Error('INSUFFICIENT_TICKETS');

      const currDisc = data.discovered || {};
      const seen = new Set();
      newFlags = results.map(r=>{
        const key=r.cat+'_'+r.grade;
        const isN=!currDisc[key]&&!seen.has(key);
        seen.add(key); return isN;
      });

      const newColl = {...(data.collection||{})};
      const newDisc = {...currDisc};
      results.forEach(r=>{
        const key=r.cat+'_'+r.grade;
        newColl[key]=(newColl[key]||0)+1;
        newDisc[key]=true;
      });

      // 임시 변수에만 저장 (commit 성공 후 적용)
      committedTickets = data.tickets - count;
      committedColl    = newColl;
      committedDisc    = newDisc;

      tx.update(userRef,{
        tickets: committedTickets,
        collection: newColl,
        discovered: newDisc
      });
    });

    // commit 성공 후 로컬 상태 반영
    tickets    = committedTickets;
    collection = committedColl;
    discovered = committedDisc;
    updateTicketUI();
    localStorage.setItem('rcm_gacha_tickets', tickets);
    showResults(results, newFlags, count);
  } catch(e){
    isLoading=false;
    if(e.message==='INSUFFICIENT_TICKETS') showToast('가챠권이 부족해요!');
    else showToast('오류가 발생했습니다. 다시 시도해주세요.');
    return;
  }
  isLoading=false;
};

// ── 카드 렌더링 ──────────────────────────────────────────────────
function makeCardHTML(r, isN, size, delay){
  const ss = r.grade==='SS';
  const slug = CAT_SLUG[r.cat]||r.cat;
  const baseImg='images/cats/'+slug+'.webp';
  const ssImg='images/cats/ss/'+slug+'.webp';
  const imgSrc=ss?ssImg:baseImg;
  // 사진이 없으면(SS는 기본 사진도 한 번 더 시도) 이미지를 지워 자리표시 아이콘이 보이게 함
  const onerr=ss
    ? "this.onerror=function(){this.remove();};this.src='"+baseImg+"';"
    : "this.remove();";
  const g=r.grade;
  const tiles=(g==='A'||g==='S'||g==='SS')?'<div class="rcm-tiles"></div>':'';
  const mini=size==='mini';
  const label=r.cat+' '+GRADE_NAMES[g]+' 카드'+(isN?', 새로 얻음':'');
  const newMark=isN?(mini?'<span class="new-dot"></span>':'<span class="new-tag">NEW</span>'):'';
  const photo='<img src="'+imgSrc+'" alt="" loading="lazy" decoding="async" onerror="'+onerr+'">';
  if(mini){
    const st=delay?' style="animation-delay:'+delay+'s"':'';
    return '<div class="nc rs mini g-'+g+'" role="group" aria-label="'+label+'"'+st+'>'+tiles+
      '<div class="in"><div class="ph">'+ICON_CAT_S+photo+newMark+'</div>'+
      '<div class="meta'+(r.cat.length>3?' long':'')+'"><span class="stamp '+g+'">'+g+'</span><span class="nm">'+r.cat+'</span></div></div></div>';
  }
  return '<div class="nc rs single g-'+g+'" role="group" aria-label="'+label+'">'+tiles+
    '<div class="in"><div class="ph">'+ICON_CAT+photo+newMark+'</div>'+
    '<div class="meta"><span class="nm">'+r.cat+'</span><span class="stamp '+g+'">'+g+'</span></div></div></div>';
}

function showResults(results, newFlags, count){
  const area=document.getElementById('result-area');
  const title=document.getElementById('result-title');
  if(count===1){
    const r=results[0],isN=newFlags[0];
    title.textContent=gradeLabel(r.grade);
    area.innerHTML=makeCardHTML(r,isN,'single');
  }else{
    const hasSpecial=results.some(r=>r.grade==='S'||r.grade==='SS');
    title.textContent=hasSpecial?'특별한 카드 등장!':`${count}장 획득!`;
    area.innerHTML=`<div class="multi-grid">${results.map((r,i)=>makeCardHTML(r,newFlags[i],'mini',i*.05)).join('')}</div>`;
  }
  document.getElementById('overlay').classList.add('open');
  document.getElementById('close-btn').focus();
}

function gradeLabel(g){
  return {C:'일반 카드 획득',B:'희귀 카드 획득!',A:'레어 카드!',S:'슈퍼 레어!',SS:'초희귀 등장!!'}[g];
}

window.closeResult = function(){
  document.getElementById('overlay').classList.remove('open');
};

// ── 합성 ─────────────────────────────────────────────────────────
window.openMergeModal = function(){
  selCount={};
  buildGradeTabs();
  setMergeGrade('C');
  document.getElementById('merge-overlay').classList.add('open');
};

function closeMergeModal(){
  document.getElementById('merge-overlay').classList.remove('open');
}
window.closeMergeModal = closeMergeModal;

function handleMergeOverlayClick(e){
  if(e.target===document.getElementById('merge-overlay')) closeMergeModal();
}
window.handleMergeOverlayClick = handleMergeOverlayClick;

function buildGradeTabs(){
  const tabs=document.getElementById('grade-tabs');
  tabs.innerHTML='';
  ['C','B','A','S'].forEach(g=>{
    const btn=document.createElement('button');
    btn.className='grade-tab '+g; btn.id='mtab-'+g; btn.type='button';
    btn.textContent=g; btn.setAttribute('aria-pressed','false'); btn.setAttribute('aria-label',g+' 등급');
    btn.onclick=()=>setMergeGrade(g);
    tabs.appendChild(btn);
  });
}

function setMergeGrade(g){
  mergeGrade=g; selCount={};
  document.querySelectorAll('.grade-tab').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false');});
  const tab=document.getElementById('mtab-'+g);
  if(tab){ tab.classList.add('active'); tab.setAttribute('aria-pressed','true'); }
  renderMergeGrid();
  updateMergeCounter();
}

function totalSel(){
  return Object.values(selCount).reduce((s,v)=>s+v,0);
}

function renderMergeGrid(){
  const grid=document.getElementById('merge-grid');
  grid.innerHTML='';
  const total=totalSel();
  CATS.forEach(cat=>{
    const have=collection[cat+'_'+mergeGrade]||0;
    if(have===0) return;
    const sel=selCount[cat]||0;
    const canAdd=sel<have&&total<3;
    const exhausted=!canAdd&&sel===0;
    const card=document.createElement('div');
    card.className='mc'+(sel>0?' selected':'')+(exhausted?' exhausted':'');
    card.tabIndex=exhausted?-1:0; card.setAttribute('role','button');
    card.innerHTML=`<div class="mc-emoji">${ICON_CAT_S}</div><div class="mc-name">${cat}</div><div class="mc-have">보유 ${have}장</div>${sel>0?`<div class="mc-sel-badge">${sel}선택</div>`:''}`;
    if(!exhausted) card.addEventListener('click',()=>toggleSel(cat));
    if(!exhausted) card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleSel(cat); } });
    grid.appendChild(card);
  });
  if(grid.children.length===0){
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 0;">${mergeGrade}등급 카드가 없어요</div>`;
  }
}

function toggleSel(cat){
  const have=collection[cat+'_'+mergeGrade]||0;
  const sel=selCount[cat]||0;
  const total=totalSel();
  const next=sel+1;
  if(next>have||(total>=3&&next>sel)){ delete selCount[cat]; }
  else{ selCount[cat]=next; }
  renderMergeGrid();
  updateMergeCounter();
}

function updateMergeCounter(){
  const t=totalSel();
  document.getElementById('sel-count').textContent=t;
  document.getElementById('merge-confirm-btn').disabled=t!==3;
}

window.confirmMerge = async function(){
  if(isMerging||totalSel()!==3) return;
  // 레이스 컨디션 방지: 트랜잭션 전에 상태 스냅샷
  const sourceGrade = mergeGrade;
  const selection   = {...selCount};
  const nextGrade=GRADES[GRADES.indexOf(sourceGrade)+1];
  if(!nextGrade){ showToast('이미 최고 등급이에요!'); return; }

  isMerging=true;
  document.getElementById('merge-confirm-btn').disabled=true;

  const resultCat=CATS[Math.floor(Math.random()*CATS.length)];
  let resultIsNew=false;
  let committedMergeColl, committedMergeDisc;

  try{
    await runTransaction(db, async tx=>{
      const snap=await tx.get(userRef);
      if(!snap.exists()) throw new Error('NO_USER');
      const data=snap.data();
      const newColl={...(data.collection||{})};

      // 보유 검증 (트랜잭션 내에서 스냅샷 기준으로 재확인)
      let total=0;
      for(const [cat,cnt] of Object.entries(selection)){
        const have=newColl[cat+'_'+sourceGrade]||0;
        if(have<cnt) throw new Error('INSUFFICIENT_CARDS');
        total+=cnt;
      }
      if(total!==3) throw new Error('INVALID_SELECTION');

      // 소비
      for(const [cat,cnt] of Object.entries(selection)){
        const key=cat+'_'+sourceGrade;
        newColl[key]=(newColl[key]||0)-cnt;
        if(newColl[key]<=0) delete newColl[key];
      }

      // 결과 카드 추가
      const resultKey=resultCat+'_'+nextGrade;
      newColl[resultKey]=(newColl[resultKey]||0)+1;
      const newDisc={...(data.discovered||{})};
      resultIsNew=!newDisc[resultKey];
      newDisc[resultKey]=true;

      // 임시 변수에만 저장 (commit 성공 후 적용)
      tx.update(userRef,{collection:newColl,discovered:newDisc});
      committedMergeColl = newColl;
      committedMergeDisc = newDisc;
    });

    // commit 성공 후 로컬 상태 반영
    collection = committedMergeColl;
    discovered = committedMergeDisc;
    closeMergeModal();
    showResults([{cat:resultCat,grade:nextGrade}],[resultIsNew],1);
    document.getElementById('result-title').textContent='합성 성공! '+gradeLabel(nextGrade);
  }catch(e){
    closeMergeModal();
    if(e.message==='INSUFFICIENT_CARDS') showToast('카드가 부족해요. 다시 선택해주세요.');
    else showToast('합성 오류가 발생했습니다.');
  }finally{
    isMerging=false;
  }
};

window.addTestTickets = async function(){
  if(!userRef){ showToast('로그인 정보 없음'); return; }
  let committedTickets;
  try{
    await runTransaction(db, async tx=>{
      const snap = await tx.get(userRef);
      if(!snap.exists()) throw new Error('NO_USER');
      committedTickets = (snap.data().tickets||0) + 10;
      tx.update(userRef,{ tickets: committedTickets });
    });
    tickets = committedTickets;
    localStorage.setItem('rcm_gacha_tickets', tickets);
    updateTicketUI();
    showToast('테스트 +10장 지급 완료');
  } catch(e){
    showToast('테스트 지급 실패: '+e.message);
  }
};

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

init();
</script>
