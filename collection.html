<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>냥카드 컬렉션 — ROOF CAT ME PLAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rcm-theme.css?v=15">
  <style>
    html{color-scheme:light;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#fff;color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
    .wrap{width:100%;max-width:480px;margin:0 auto;}

    /* 진행률 */
    .prog{display:flex;flex-direction:column;gap:14px;padding:22px 20px 6px;}
    .nick{font-size:14px;color:var(--ink-soft);}
    .prog-row{display:flex;flex-direction:column;gap:7px;}
    .prog-top{display:flex;justify-content:space-between;align-items:baseline;}
    .prog-label{font-size:13px;color:var(--ink-soft);}
    .prog-val{font-size:15px;font-weight:800;color:var(--roof-text);}
    .bar{height:10px;border-radius:5px;background:#F1E6D2;overflow:hidden;}
    .bar-fill{height:100%;border-radius:5px;background:var(--roof);transition:width .6s ease;}

    /* 섹션 제목 */
    .sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:26px 20px 12px;}
    .sec-head h2{white-space:nowrap;}
    .sec-head .hint{font-size:13px;color:var(--ink-soft);text-align:right;}
    .ss-head{display:flex;flex-direction:column;gap:4px;padding:24px 20px 14px;}
    .ss-head .top{display:flex;justify-content:space-between;align-items:baseline;}
    .ss-head .sub{font-size:13px;color:var(--ink-soft);}

    /* 그리드 */
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px 36px;}
    #ss-grid{padding-bottom:40px;}

    .foot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 20px 18px;}
    .foot b{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--roof);}
    .foot span{font-size:12px;color:var(--ink-soft);}

    /* 상세 보기: 카드가 커지면서 아래에 등급별 보유 */
    .overlay{display:none;position:fixed;inset:0;background:rgba(40,28,22,.82);z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px;overflow:auto;}
    .overlay.open{display:flex;}
    #modal-card{width:100%;display:flex;justify-content:center;}
    .nc.big{width:min(300px,100%);cursor:default;animation:zoomIn .26s ease both;}
    .nc.big:active{transform:none;}
    .nc.big .in{padding:10px 10px 16px;gap:11px;}
    .nc.big .ph{height:min(280px,56vh);}
    .nc.big .nm{font-size:24px;}
    .nc.big .meta{min-height:36px;column-gap:8px;}
    .nc.big .stamp{width:36px;height:36px;font-size:18px;}
    .nc.big .ds{font-size:14px;line-height:1.65;min-height:0;}
    .nc.big .tg span{font-size:12px;padding:3px 10px;}
    .nc.big.locked{min-height:min(420px,66vh);gap:12px;}
    .nc.big.locked p{font-size:14px;}
    @keyframes zoomIn{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){.nc.big{animation:none;}}
    .gchips{display:flex;gap:6px;justify-content:center;width:100%;max-width:360px;}
    .gchip{display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:1 1 0;min-width:0;padding:4px 6px 4px 4px;border-radius:999px;background:#fff;border:2px solid transparent;font-family:inherit;font-size:12px;font-weight:800;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .gchip .stamp{width:22px;height:22px;font-size:11px;}
    .gchip[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,169,59,.4);}
    .gchip:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}
    .gchip.off{background:#F4EFE8;border:1.5px dashed #CFC4B6;color:#6F655D;}
    .gchip.off[aria-pressed="true"]{border-color:var(--gold);border-style:solid;}
    .gchip .stamp.off{background:#fff;border:1.5px dashed #CFC4B6;color:#6F655D;}
    .overlay .rcm-btn{width:auto;min-width:160px;height:48px;padding:0 36px;}
  </style>
</head>
<body>

<div class="rcm-hero"><h1 class="rcm-hero-title">냥카드 컬렉션</h1><img class="rcm-hero-cast nap" src="images/nap.png" alt="" width="440" height="460"></div>

<main class="wrap">
  <section class="prog">
    <p class="nick" id="hdr-nick"></p>
    <div class="prog-row">
      <div class="prog-top"><span class="prog-label">만난 고양이</span><span class="prog-val" id="cat-prog-val">0 / 43마리</span></div>
      <div class="bar"><div class="bar-fill" id="cat-prog-bar" style="width:0%"></div></div>
    </div>
    <div class="prog-row">
      <div class="prog-top"><span class="prog-label">모은 카드</span><span class="prog-val" id="card-prog-val">0 / 230장</span></div>
      <div class="bar"><div class="bar-fill" id="card-prog-bar" style="width:0%"></div></div>
    </div>
  </section>

  <div class="sec-head"><h2 class="rcm-h2">고양이 43마리</h2><span class="hint">눌러서 등급별로 보기</span></div>
  <div class="grid" id="grid"></div>

  <!-- SS 스페셜 섹션 -->
  <div class="rcm-tiles"></div>
  <div class="ss-head">
    <div class="top"><h2 class="rcm-h2">SS 스페셜 카드</h2><span class="prog-val" id="ss-prog-val">0 / 15장</span></div>
    <span class="sub">가챠에서만 만날 수 있는 특별한 카드예요</span>
  </div>
  <div class="grid" id="ss-grid"></div>
</main>

<div class="foot"><b>ROOF_CAT_ME PLAY</b><span>루프캣미 매장에서 즐기는 미니게임</span></div>
<div class="rcm-roof"></div>

<!-- 상세 보기 -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="냥카드 상세">
  <div id="modal-card"></div>
  <div class="gchips" id="modal-grades" role="group" aria-label="등급 선택"></div>
  <button type="button" class="rcm-btn ghost" id="modal-close">닫기</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqxMZf8xDfaQ1oAheXJAuYbWBBfZBkgvI",
  authDomain: "roofcatmeplay.firebaseapp.com",
  projectId: "roofcatmeplay",
  storageBucket: "roofcatmeplay.firebasestorage.app",
  messagingSenderId: "793320259272",
  appId: "1:793320259272:web:7ba8355067b03edc2b2ffd"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── 고양이 명단: cats.json 한 곳에서 읽음 (신입 고양이는 cats.json에만 추가) ──
let _catsData;
try{
  _catsData = await (await fetch('cats.json?v=1',{cache:'no-cache'})).json();
}catch(e){
  document.body.innerHTML='<p style="padding:40px 20px;text-align:center;font-family:sans-serif;color:#4A3F3A">고양이 명단(cats.json)을 불러오지 못했어요.<br>새로고침해 주세요.</p>';
  throw e;
}
const CATS = _catsData.cats.map(c=>c.name).sort((a,b)=>a.localeCompare(b,'ko'));
const SS_CATS = _catsData.ss.map(c=>c.name);
const CAT_SLUG = Object.fromEntries([..._catsData.cats,..._catsData.ss].map(c=>[c.name,c.slug]));
const CAT_DESC = Object.fromEntries([..._catsData.cats,..._catsData.ss].map(c=>[c.name,{d:c.desc,t:c.tags}]));

const GRADES = ['C','B','A','S','SS'];
const GRADE_NAMES = {C:'일반',B:'희귀',A:'레어',S:'슈퍼레어',SS:'초희귀'};
const TOTAL_CATS  = CATS.length;      // 43
const TOTAL_CARDS = CATS.length * GRADES.length + SS_CATS.length; // 43×5 + 15 = 230

const ICON_CAT  = '<svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="rgba(74,63,58,.38)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M10 22 L12 7 L22 14 Q24 13.6 26 14 L36 7 L38 22 Q40 33 24 40 Q8 33 10 22Z"/><circle cx="18" cy="24" r="1.6"/><circle cx="30" cy="24" r="1.6"/><path d="M22 29 h4"/></svg>';
const ICON_LOCK = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8B8077" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const ICON_LOCK_S = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B8077" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const ICON_CHECK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A3F3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

// Firestore 원본 — localStorage 불사용
let collection = {};
let discovered = {};

function init(){
  onAuthStateChanged(auth, async user => {
    if(!user){ location.href='login.html'; return; }
    try{
      const snap = await getDoc(doc(db,'users',user.uid));
      const data = snap.data();
      const nick = data.nickname || '손님';
      document.getElementById('hdr-nick').textContent = nick + '님의 컬렉션';
      localStorage.setItem('rcm_nickname', nick); // 캐시 갱신
      collection = data.collection || {};
      discovered = data.discovered || {};
    } catch(e){
      // Firestore 실패 시 빈 상태로 렌더
    }
    render();
  });
}

function getBestGrade(cat){
  // discovered 기준 (합성 소비해도 유지)
  for(let i=GRADES.length-1;i>=0;i--){
    if(discovered[cat+'_'+GRADES[i]]) return GRADES[i];
  }
  return null;
}

function makeCard(cat, grade, isSsOnly){
  const card = document.createElement('div');
  card.tabIndex = 0;
  card.setAttribute('role','button');
  if(grade){
    card.className = 'nc g-'+grade;
    card.setAttribute('aria-label', cat+' '+GRADE_NAMES[grade]+' 카드');
    const slug = CAT_SLUG[cat]||cat;
    const baseImg = 'images/cats/'+slug+'.webp';
    const ssImg   = 'images/cats/ss/'+slug+'.webp';
    const imgSrc  = (grade==='SS') ? ssImg : baseImg;
    // SS 등급 일반 고양이: ss 폴더 사진이 없으면 기본 사진으로 한 번 더 시도
    const imgOnerror = (grade==='SS' && !isSsOnly)
      ? `this.onerror=function(){this.remove();};this.src='${baseImg}';`
      : `this.remove();`;
    const meta = CAT_DESC[cat] || {d:'루프캣미의 소중한 냥이.',t:[]};
    const tiles = (grade==='A'||grade==='S'||grade==='SS') ? '<div class="rcm-tiles"></div>' : '';
    card.innerHTML = `${tiles}
      <div class="in">
        <div class="ph">${ICON_CAT}<img src="${imgSrc}" alt="" loading="lazy" decoding="async" onerror="${imgOnerror}"></div>
        <div class="meta"><span class="nm">${cat}</span><span class="stamp ${grade}">${grade}</span></div>
        <p class="ds">${meta.d}</p>
        <div class="tg">${meta.t.slice(0,3).map(t=>`<span>${t}</span>`).join('')}</div>
      </div>`;
  } else {
    card.className = 'nc locked';
    card.setAttribute('aria-label', cat+' 카드, 아직 만나지 못했어요');
    card.innerHTML = `${ICON_LOCK}<span class="nm">${cat}</span><p>${isSsOnly?'가챠로만 만날 수 있어요':'아직 만나지 못했어요'}</p>`;
  }
  card.addEventListener('click', ()=>openModal(cat, isSsOnly));
  card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModal(cat, isSsOnly); } });
  return card;
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let catsUnlocked=0, cardsUnlocked=0;

  // ── 일반 고양이 43마리 ──
  CATS.forEach(cat=>{
    const best = getBestGrade(cat);
    if(best) catsUnlocked++;
    GRADES.forEach(g=>{ if(discovered[cat+'_'+g]) cardsUnlocked++; });
    grid.appendChild(makeCard(cat, best, false));
  });

  // ── SS 스페셜 카드 15장 ──
  const ssGrid = document.getElementById('ss-grid');
  ssGrid.innerHTML = '';
  let ssUnlocked = 0;

  SS_CATS.forEach(cat=>{
    const obtained = !!discovered[cat+'_SS'];
    if(obtained){ ssUnlocked++; cardsUnlocked++; }
    ssGrid.appendChild(makeCard(cat, obtained?'SS':null, true));
  });

  document.getElementById('cat-prog-val').textContent  = catsUnlocked+' / '+TOTAL_CATS+'마리';
  document.getElementById('card-prog-val').textContent = cardsUnlocked+' / '+TOTAL_CARDS+'장';
  document.getElementById('ss-prog-val').textContent   = ssUnlocked+' / '+SS_CATS.length+'장';
  document.getElementById('cat-prog-bar').style.width  = (catsUnlocked/TOTAL_CATS*100).toFixed(1)+'%';
  document.getElementById('card-prog-bar').style.width = (cardsUnlocked/TOTAL_CARDS*100).toFixed(1)+'%';
}

let modalCat = null, modalSsOnly = false, modalGrade = null;

function bigCardHTML(cat, grade, isSsOnly){
  if(!discovered[cat+'_'+grade]){
    const hint = isSsOnly ? '가챠로만 만날 수 있어요' : GRADE_NAMES[grade]+' 등급 · 아직 만나지 못했어요';
    return `<div class="nc big locked" role="group" aria-label="${cat} ${GRADE_NAMES[grade]} 카드, 잠김">${ICON_LOCK}<span class="nm">${cat}</span><p>${hint}</p></div>`;
  }
  const slug = CAT_SLUG[cat]||cat;
  const baseImg = 'images/cats/'+slug+'.webp';
  const ssImg   = 'images/cats/ss/'+slug+'.webp';
  const imgSrc  = (grade==='SS') ? ssImg : baseImg;
  const onerr   = (grade==='SS' && !isSsOnly)
    ? `this.onerror=function(){this.remove();};this.src='${baseImg}';`
    : `this.remove();`;
  const meta  = CAT_DESC[cat] || {d:'루프캣미의 소중한 냥이.',t:[]};
  // C·B의 지붕은 CSS(::before)가 붙이므로 A·S·SS만 마크업 띠를 넣는다
  const strip = (grade==='A'||grade==='S'||grade==='SS') ? '<div class="rcm-tiles"></div>' : '';
  return `<div class="nc big g-${grade}" role="group" aria-label="${cat} ${GRADE_NAMES[grade]} 카드">${strip}
    <div class="in">
      <div class="ph">${ICON_CAT}<img src="${imgSrc}" alt="" decoding="async" onerror="${onerr}"></div>
      <div class="meta"><span class="nm">${cat}</span><span class="stamp ${grade}">${grade}</span></div>
      <p class="ds">${meta.d}</p>
      <div class="tg">${meta.t.slice(0,3).map(t=>`<span>${t}</span>`).join('')}</div>
    </div></div>`;
}

function showGrade(g){
  modalGrade = g;
  document.getElementById('modal-card').innerHTML = bigCardHTML(modalCat, g, modalSsOnly);
  document.querySelectorAll('#modal-grades .gchip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.g===g ? 'true' : 'false'));
}

function buildChips(){
  const wrap = document.getElementById('modal-grades');
  wrap.innerHTML = '';
  const list = modalSsOnly ? ['SS'] : GRADES.slice().reverse();
  list.forEach(g=>{
    const obtained = !!discovered[modalCat+'_'+g];
    const cnt = collection[modalCat+'_'+g] || 0;
    const label = obtained ? cnt+'장' : ICON_LOCK_S;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gchip'+(obtained?'':' off');
    b.dataset.g = g;
    b.setAttribute('aria-pressed','false');
    b.setAttribute('aria-label', g+' 등급 '+GRADE_NAMES[g]+', '+(cnt>0?cnt+'장 보유':(obtained?'획득 완료':'잠김')));
    b.innerHTML = `<span class="stamp ${obtained?g:'off'}">${g}</span>${label}`;
    b.addEventListener('click', e=>{ e.stopPropagation(); showGrade(g); });
    wrap.appendChild(b);
  });
}

function openModal(cat, isSsOnly){
  modalCat = cat; modalSsOnly = !!isSsOnly;
  buildChips();
  showGrade(modalSsOnly ? 'SS' : (getBestGrade(cat) || 'C'));
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal-close').focus();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('overlay') || e.target===document.getElementById('modal-card')) closeModal();
});
document.getElementById('modal-close').addEventListener('click', closeModal);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

init();
</script>
</body>
</html>
