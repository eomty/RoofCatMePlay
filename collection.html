<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>냥카드 컬렉션 — ROOF CAT ME PLAY</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    html{color-scheme:light;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--red:#E8392A;--bg:#FFF8F2;--text:#2A1A14;--muted:#9E7C70;}
    body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:60px;}

    /* 헤더 */
    .hdr{width:100%;background:var(--red);color:#fff;padding:20px;text-align:center;}
    .hdr-brand{font-size:11px;letter-spacing:.15em;opacity:.75;margin-bottom:4px;}
    .hdr-title{font-size:26px;font-weight:900;}
    .hdr-nick{font-size:13px;opacity:.85;margin-top:3px;}

    /* 진행률 */
    .progress-wrap{width:100%;max-width:360px;padding:20px 16px 8px;}
    .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .progress-label{font-size:12px;font-weight:700;color:var(--muted);}
    .progress-value{font-size:13px;font-weight:900;color:var(--text);}
    .progress-bar-bg{width:100%;height:8px;background:rgba(158,124,112,.15);border-radius:4px;overflow:hidden;margin-bottom:14px;}
    .progress-bar-fill{height:100%;border-radius:4px;background:var(--red);transition:width .6s ease;}

    /* 그리드 */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 16px 0;width:100%;max-width:360px;}

    /* 카드 */
    .cat-card{border-radius:12px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;cursor:pointer;position:relative;overflow:hidden;min-height:0;-webkit-tap-highlight-color:transparent;transition:transform .15s;}
    .cat-card:active{transform:scale(.93);}
    .cat-card.locked{background:#e8e0d8;border:2px dashed rgba(158,124,112,.3);align-items:center;justify-content:center;gap:5px;min-height:148px;}
    .cat-card.unlocked{box-shadow:0 2px 10px rgba(0,0,0,.15);}
    /* 사진 영역 */
    .cat-card .card-photo{width:100%;height:76px;flex:0 0 76px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;}
    /* 상단 타입 바 */
    .cat-card .card-topbar{width:100%;flex:0 0 18px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;background:rgba(0,0,0,.25);}
    .ct-type{font-size:7px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.06em;}
    .ct-grade{font-size:7px;font-weight:900;color:#fff;}
    /* 설명 박스 */
    .cat-card .card-desc{width:100%;flex:0 0 auto;padding:4px 6px 3px;background:rgba(0,0,0,.28);display:flex;flex-direction:column;gap:2px;overflow:hidden;}
    .cd-text{font-size:7px;line-height:1.5;color:rgba(255,255,255,.85);word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .cd-tags{display:flex;gap:3px;flex-wrap:wrap;}
    .cd-tag{font-size:6px;font-weight:700;padding:1px 4px;border-radius:8px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.75);}
    /* 하단 등급 바 */
    .cat-card .card-footer-bar{width:100%;flex:0 0 20px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;}
    .cf-name{font-size:7.5px;font-weight:700;}
    .cf-stars{font-size:7px;letter-spacing:1px;}
    /* 잠금 */
    .card-emoji{font-size:22px;line-height:1;}
    .card-name{font-size:10px;font-weight:700;text-align:center;line-height:1.2;}
    .locked .card-name{color:rgba(158,124,112,.6);}
    #grid{margin-bottom:24px;}

    /* 상세 모달 */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:flex-end;justify-content:center;}
    .overlay.open{display:flex;}
    .sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px 24px 44px;display:flex;flex-direction:column;gap:14px;}
    .sheet-handle{width:36px;height:4px;background:#e0d8d4;border-radius:2px;align-self:center;}
    .sheet-name{font-size:22px;font-weight:900;color:var(--text);text-align:center;}
    .grade-list{display:flex;flex-direction:column;gap:10px;}
    .grade-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;}
    .grade-row.collected{box-shadow:0 2px 8px rgba(0,0,0,.1);}
    .grade-row.not-collected{background:#f2ece8;opacity:.5;}
    .grade-badge{font-size:14px;font-weight:900;width:32px;text-align:center;}
    .grade-info{flex:1;}
    .grade-name{font-size:13px;font-weight:700;}
    .grade-count{font-size:11px;opacity:.7;margin-top:1px;}
    .grade-lock{font-size:18px;margin-left:auto;}
    .close-btn{background:none;border:1.5px solid #e0d8d4;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;}
  
/* ── 등급별 카드 배경 ───────────────────────────── */
.card-C{background:linear-gradient(160deg,#424242,#757575,#424242);}
.card-C .card-footer-bar{background:#757575;}
.card-C .cf-name,.card-C .cf-stars{color:#e0e0e0;}

.card-B{background:linear-gradient(160deg,#1B5E20,#388E3C,#1B5E20);}
.card-B .card-footer-bar{background:#388E3C;}
.card-B .cf-name,.card-B .cf-stars{color:#C8E6C9;}

.card-A{background:linear-gradient(160deg,#0D47A1,#1976D2,#0D47A1);}
.card-A .card-footer-bar{background:#1565C0;}
.card-A .cf-name,.card-A .cf-stars{color:#BBDEFB;}

.card-S{background:linear-gradient(160deg,#4A148C,#6A1B9A,#4A148C);}
.card-S .card-footer-bar{background:#6A1B9A;}
.card-S .cf-name,.card-S .cf-stars{color:#E1BEE7;}
.card-S{animation:glowS 2.5s ease-in-out infinite;}
@keyframes glowS{0%,100%{box-shadow:0 4px 16px rgba(206,147,216,.35)}50%{box-shadow:0 4px 28px rgba(206,147,216,.7)}}

.card-SS{background:linear-gradient(160deg,#7b1212,#b71c1c,#4a148c,#1a237e);}
.card-SS .card-footer-bar{background:linear-gradient(90deg,#b71c1c,#e65100,#f9a825,#1b5e20,#1a237e);}
.card-SS .cf-name,.card-SS .cf-stars{color:#FFD700;}
.card-SS{animation:glowSS 2s ease-in-out infinite;}
@keyframes glowSS{0%,100%{box-shadow:0 4px 14px rgba(255,215,0,.3)}50%{box-shadow:0 4px 28px rgba(255,215,0,.8)}}
.card-border-inner{position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:10;border:1.5px solid rgba(255,255,255,.18);}
.card-S .card-border-inner{border-color:rgba(206,147,216,.45);}
.card-SS .card-border-inner{border-color:rgba(255,215,0,.65);}

/* 홀로그래픽 레이어 (S/SS CSS-only) */
.holo-scan{position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0px,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);
  opacity:0;transition:opacity .3s;}
.holo-sheen{position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:6;
  background:conic-gradient(from 0deg,#ff0080,#ff8c00,#ffd700,#00ff80,#00bfff,#8000ff,#ff0080);
  opacity:0;mix-blend-mode:color-dodge;filter:blur(3px);transition:opacity .3s;}
.holo-glare{position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:7;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.22) 0%,transparent 55%);
  opacity:0;transition:opacity .3s;}
.cat-card:hover .holo-scan,.cat-card:active .holo-scan{opacity:1;}
.cat-card:hover .holo-glare,.cat-card:active .holo-glare{opacity:1;}
.card-S:hover .holo-sheen,.card-S:active .holo-sheen{opacity:.12;}
.card-SS:hover .holo-sheen,.card-SS:active .holo-sheen{opacity:.28;}

/* SS 스파클 */
.holo-sparkle{position:absolute;inset:0;pointer-events:none;z-index:8;border-radius:12px;
  background-image:radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1px),
                   radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:22px 22px,14px 14px;background-position:0 0,7px 7px;
  opacity:0;mix-blend-mode:screen;transition:opacity .3s;}
.card-SS:hover .holo-sparkle,.card-SS:active .holo-sparkle{opacity:.55;}
.card-S:hover .holo-sparkle,.card-S:active .holo-sparkle{opacity:.22;}

/* 기존 shimmer (SS 카드용) */
.card-shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:shimmer 3.5s ease-in-out infinite;pointer-events:none;z-index:9;}
@keyframes shimmer{0%{left:-100%}40%,100%{left:200%}}

/* 공통 카드 구조 */
.single-card{width:160px;height:220px;border-radius:20px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:popIn .4s ease;-webkit-tap-highlight-color:transparent;}
.card-frame{position:absolute;inset:0;border-radius:20px;pointer-events:none;}
.card-photo{width:100%;height:140px;display:flex;align-items:center;justify-content:center;font-size:56px;position:relative;}
.card-info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;}
.cat-name{font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.3);}
.grade-badge{font-size:11px;font-weight:900;padding:2px 8px;border-radius:8px;}
.card-new-badge{position:absolute;top:10px;left:10px;background:#FF6B6B;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;}

/* 미니 카드 (10연차) */
.mini-card{border-radius:12px;aspect-ratio:.7;display:flex;flex-direction:column;position:relative;overflow:hidden;animation:popIn .3s ease both;}
.mini-card .card-frame{border-radius:12px;}
.mini-card .card-photo{height:60%;font-size:28px;}
.mini-card .card-info{padding:4px 2px;}
.mini-card .cat-name{font-size:9px;}
.mini-card .grade-badge{font-size:8px;padding:1px 5px;}
.mini-new{position:absolute;top:4px;left:4px;width:8px;height:8px;background:#FF6B6B;border-radius:50%;}

  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">ROOF CAT ME PLAY</div>
  <div class="hdr-title">📖 냥카드 컬렉션</div>
  <div class="hdr-nick" id="hdr-nick"></div>
</div>

<div class="progress-wrap">
  <div class="progress-row">
    <span class="progress-label">🐱 마리 수집</span>
    <span class="progress-value" id="cat-prog-val">0 / 43마리</span>
  </div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="cat-prog-bar" style="width:0%"></div></div>
  <div class="progress-row">
    <span class="progress-label">🃏 카드 수집</span>
    <span class="progress-value" id="card-prog-val">0 / 230장</span>
  </div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="card-prog-bar" style="width:0%"></div></div>
</div>

<div class="grid" id="grid"></div>

<!-- SS 스페셜 섹션 -->
<hr style="width:calc(100% - 32px);max-width:328px;border:none;border-top:2px solid rgba(255,215,0,.3);margin:0;">
<div style="width:100%;max-width:360px;padding:16px 16px 8px;">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0;">
    <span style="font-size:16px;">🌟</span>
    <span style="font-size:13px;font-weight:900;color:#2A1A14;letter-spacing:.05em;">SS 스페셜 카드</span>
    <span style="font-size:11px;color:#9E7C70;margin-left:auto;" id="ss-prog-val">0 / 15장</span>
  </div>
  <div id="ss-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;"></div>
</div>

<!-- 상세 모달 -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-name" id="modal-name"></div>
    <div class="grade-list" id="modal-grades"></div>
    <button class="close-btn" onclick="document.getElementById('overlay').classList.remove('open')">닫기</button>
  </div>
</div>

const GRADES = ['C','B','A','S','SS'];
const GRADE_COLORS = {C:'linear-gradient(135deg,#757575,#9E9E9E)',B:'linear-gradient(135deg,#388E3C,#66BB6A)',A:'linear-gradient(135deg,#1565C0,#42A5F5)',S:'linear-gradient(135deg,#6A1B9A,#BA68C8)',SS:'linear-gradient(135deg,#F57F17,#FFD54F)'};
const GRADE_NAMES  = {C:'일반',B:'희귀',A:'레어',S:'슈퍼레어',SS:'초희귀'};
const GRADE_TEXT   = {C:'#fff',B:'#fff',A:'#fff',S:'#fff',SS:'#FFD700'};
const TOTAL_CATS  = CATS.length;      // 43
const TOTAL_CARDS = CATS.length * GRADES.length + SS_CATS.length; // 43×5 + 15 = 230

// Firestore 원본 — localStorage 불사용
let collection = {};
let discovered = {};

function init(){
  onAuthStateChanged(auth, async user => {
    if(!user){ location.href='login.html'; return; }
    try{
      const snap = await getDoc(doc(db,'users',user.uid));
      const data = snap.data();
      const nick = data.nickname || '손님';
      document.getElementById('hdr-nick').textContent = nick + '님의 컬렉션';
      localStorage.setItem('rcm_nickname', nick); // 캐시 갱신
      collection = data.collection || {};
      discovered = data.discovered || {};
    } catch(e){
      // Firestore 실패 시 빈 상태로 렌더
    }
    render();
  });
}

function getBestGrade(cat){
  // discovered 기준 (합성 소비해도 유지)
  for(let i=GRADES.length-1;i>=0;i--){
    if(discovered[cat+'_'+GRADES[i]]) return GRADES[i];
  }
  return null;
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let catsUnlocked=0, cardsUnlocked=0;

  // ── 일반 고양이 43마리 ──
  CATS.forEach(cat=>{
    const best = getBestGrade(cat);
    const hasAny = !!best;
    if(hasAny) catsUnlocked++;
    GRADES.forEach(g=>{ if(discovered[cat+'_'+g]) cardsUnlocked++; });

    const card = document.createElement('div');
    if(hasAny){
      card.className = 'cat-card unlocked card-'+best;
      const ss = best==='SS';
      const slug = CAT_SLUG[cat]||cat;
      const baseImg = 'images/cats/'+slug+'.webp';
      const ssImg   = 'images/cats/ss/'+slug+'.webp';
      const imgSrc  = ss ? ssImg : baseImg;
      const imgOnerror = ss
        ? `this.src='${baseImg}';this.onerror=function(){this.style.display='none';this.parentNode.innerHTML+='🐱';};`
        : `this.style.display='none';this.parentNode.innerHTML+='🐱';`;
      const desc = CAT_DESC[cat]||{desc:'루프캣미의 소중한 냥이.',traits:[]};
      const gradeStars = {C:'★',B:'★★',A:'★★★',S:'★★★★',SS:'★★★★★'};
      const gradeLabel = {C:'일반',B:'희귀',A:'레어',S:'슈퍼레어',SS:'초희귀'};
      card.innerHTML = `
        <div class="holo-scan"></div>
        <div class="holo-sheen"></div>
        <div class="holo-sparkle"></div>
        <div class="holo-glare"></div>
        <div class="card-border-inner"></div>
        ${ss?'<div class="card-shimmer"></div>':''}
        <div class="card-topbar">
          <span class="ct-type">루프캣미</span>
          <span class="ct-grade">${cat}</span>
        </div>
        <div class="card-photo" style="padding:0;">
          <img src="${imgSrc}" loading="lazy" decoding="async"
            style="width:100%;height:100%;object-fit:cover;"
            onerror="${imgOnerror}">
        </div>
        <div class="card-desc">
          <span class="cd-text">${desc.desc}</span>
          <div class="cd-tags">${desc.traits.slice(0,3).map(t=>`<span class="cd-tag">${t}</span>`).join('')}</div>
        </div>
        <div class="card-footer-bar">
          <span class="cf-name">${gradeLabel[best]}</span>
          <span class="cf-stars">${gradeStars[best]}</span>
        </div>`;
    } else {
      card.className = 'cat-card locked';
      card.innerHTML = `
        <div style="font-size:24px;">🔒</div>
        <div class="card-name" style="font-size:10px;color:rgba(158,124,112,.6);">${cat}</div>`;
    }
    card.addEventListener('click', ()=>openModal(cat, false));
    grid.appendChild(card);
  });

  // ── SS 스페셜 카드 15장 ──
  const ssGrid = document.getElementById('ss-grid');
  ssGrid.innerHTML = '';
  let ssUnlocked = 0;

  SS_CATS.forEach(cat=>{
    const key = cat+'_SS';
    const obtained = !!discovered[key];
    if(obtained){ ssUnlocked++; cardsUnlocked++; }

    const card = document.createElement('div');
    if(obtained){
      card.className = 'cat-card unlocked card-SS';
      const slug = CAT_SLUG[cat]||cat;
      const imgSrc = 'images/cats/ss/'+slug+'.webp';
      card.innerHTML = `
        <div class="holo-scan"></div>
        <div class="holo-sheen"></div>
        <div class="holo-sparkle"></div>
        <div class="holo-glare"></div>
        <div class="card-border-inner"></div>
        <div class="card-shimmer"></div>
        <div class="card-topbar">
          <span class="ct-type">SS 스페셜</span>
          <span class="ct-grade" style="color:#FFD700;">${cat}</span>
        </div>
        <div class="card-photo" style="padding:0;">
          <img src="${imgSrc}" loading="lazy" decoding="async"
            style="width:100%;height:100%;object-fit:cover;"
            onerror="this.style.display='none';this.parentNode.innerHTML+='⭐';">
        </div>
        <div class="card-footer-bar">
          <span class="cf-name">초희귀</span>
          <span class="cf-stars">★★★★★</span>
        </div>`;
    } else {
      card.className = 'cat-card locked';
      card.innerHTML = `
        <div style="font-size:24px;">🔒</div>
        <div class="card-name" style="font-size:10px;color:rgba(158,124,112,.6);">${cat}</div>`;
    }
    card.addEventListener('click', ()=>openModal(cat, true));
    ssGrid.appendChild(card);
  });

  document.getElementById('cat-prog-val').textContent  = catsUnlocked+' / '+TOTAL_CATS+'마리';
  document.getElementById('card-prog-val').textContent = cardsUnlocked+' / '+TOTAL_CARDS+'장';
  document.getElementById('ss-prog-val').textContent   = ssUnlocked+' / '+SS_CATS.length+'장';
  document.getElementById('cat-prog-bar').style.width  = (catsUnlocked/TOTAL_CATS*100).toFixed(1)+'%';
  document.getElementById('card-prog-bar').style.width = (cardsUnlocked/TOTAL_CARDS*100).toFixed(1)+'%';
}

function openModal(cat, isSsOnly){
  document.getElementById('modal-name').textContent = cat;
  const list = document.getElementById('modal-grades');
  list.innerHTML = '';

  if(isSsOnly){
    // SS 스페셜 카드 — SS 등급만 표시
    const obtained = !!discovered[cat+'_SS'];
    const cnt = collection[cat+'_SS'] || 0;
    const row = document.createElement('div');
    row.className = 'grade-row '+(obtained?'collected':'not-collected');
    if(obtained) row.style.background = GRADE_COLORS['SS'];
    row.innerHTML = `
      <div class="grade-badge" style="color:${obtained?GRADE_TEXT['SS']:'#9E7C70'}">SS</div>
      <div class="grade-info">
        <div class="grade-name" style="color:${obtained?GRADE_TEXT['SS']:'#9E7C70'}">초희귀 스페셜</div>
        ${cnt>0?`<div class="grade-count" style="color:${GRADE_TEXT['SS']}">${cnt}장 보유</div>`:obtained?`<div class="grade-count" style="color:${GRADE_TEXT['SS']}">획득 완료</div>`:'<div class="grade-count" style="color:#9E7C70">가챠로만 획득 가능</div>'}
      </div>
      <div class="grade-lock">${obtained?'✓':'🔒'}</div>`;
    list.appendChild(row);
  } else {
    // 일반 고양이 — 5등급 모두 표시
    GRADES.slice().reverse().forEach(g=>{
      const obtained = !!discovered[cat+'_'+g];
      const cnt = collection[cat+'_'+g] || 0;
      const row = document.createElement('div');
      row.className = 'grade-row '+(obtained?'collected':'not-collected');
      if(obtained) row.style.background = GRADE_COLORS[g];
      row.innerHTML = `
        <div class="grade-badge" style="color:${obtained?GRADE_TEXT[g]:'#9E7C70'}">${g}</div>
        <div class="grade-info">
          <div class="grade-name" style="color:${obtained?GRADE_TEXT[g]:'#9E7C70'}">${GRADE_NAMES[g]}</div>
          ${cnt>0?`<div class="grade-count" style="color:${GRADE_TEXT[g]}">${cnt}장 보유</div>`:obtained?`<div class="grade-count" style="color:${GRADE_TEXT[g]}">획득 완료 (합성 소비됨)</div>`:''}
        </div>
        <div class="grade-lock">${obtained?'✓':'🔒'}</div>`;
      list.appendChild(row);
    });
  }
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e){
  if(e.target===document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', closeModal);

init();
</script>
</body>
</html>
