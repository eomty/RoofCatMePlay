<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>냥빙고 — ROOF CAT ME PLAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rcm-theme.css">
  <style>
    html{color-scheme:light;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#fff;color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    .page{width:100%;max-width:480px;margin:0 auto;padding:0 20px;flex:1;}

    /* 소개 + 진행 */
    .intro{display:flex;flex-direction:column;gap:6px;padding:22px 0 0;}
    .nick{font-size:14px;color:var(--ink-soft);}
    .intro p{font-size:14px;line-height:1.65;color:var(--ink-soft);word-break:keep-all;}
    .prog{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 4px;font-size:15px;font-weight:800;color:var(--ink-soft);}
    .prog-bingo{color:var(--roof-text);}

    /* 그리드 */
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:8px 0 0;width:100%;}
    .cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:10px;border-radius:12px;background:#fff;border:1.5px solid var(--line);cursor:pointer;transition:transform .15s;-webkit-tap-highlight-color:transparent;overflow:hidden;}
    .cell:active{transform:scale(.96);}
    .cell:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}
    .cell-name{font-size:13.5px;line-height:1.4;font-weight:700;color:var(--ink);text-align:center;word-break:keep-all;}
    .cell.done{background:#FFF3EA;border-color:#E4572E;cursor:default;}
    .cell.done .cell-name{color:#8A2B16;}
    .cell-check{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:var(--roof-btn);display:flex;align-items:center;justify-content:center;}
    @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
    .cell.just-done{animation:pop .4s ease;}
    @media (prefers-reduced-motion:reduce){.cell.just-done{animation:none;}}

    .notes{display:flex;flex-direction:column;gap:6px;padding:18px 0 36px;font-size:12.5px;line-height:1.6;color:var(--ink-soft);text-align:center;word-break:keep-all;}
    .reward{display:inline-block;align-self:center;padding:6px 14px;border-radius:999px;background:var(--ivory);border:1.5px solid var(--gold);font-weight:700;color:#8A2B16;}

    /* 오버레이 */
    .overlay{display:none;position:fixed;inset:0;background:rgba(40,28,22,.55);z-index:1000;align-items:flex-end;justify-content:center;}
    .overlay.open{display:flex;}
    .sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:14px 20px 32px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto;}
    .sheet-handle{width:36px;height:4px;background:#E0D8D4;border-radius:2px;align-self:center;}
    .sheet-name{font-size:22px;font-weight:800;color:var(--roof);text-align:center;}

    /* 업로드 */
    .upload-wrap{position:relative;border:2px dashed #E4572E;border-radius:14px;padding:26px;text-align:center;background:#FFF3EA;cursor:pointer;}
    .upload-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .upload-ico{display:flex;justify-content:center;margin-bottom:8px;}
    .upload-lbl{font-size:14px;font-weight:700;color:var(--roof-text);}
    .note-small{font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.6;padding:0 4px;}
    #photo-preview{width:100%;border-radius:12px;display:none;max-height:200px;object-fit:cover;}
    .judge-btn{display:none;}
    .loading{text-align:center;color:var(--ink-soft);font-size:14px;display:none;}
    .result{text-align:center;font-size:17px;font-weight:800;display:none;padding:8px;}
    .result.ok{color:#2E7D4F;}
    .result.ng{color:var(--roof-text);}

    /* 토스트 */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#4A3F3A;color:#FBF0D9;padding:14px 22px;border-radius:12px;font-size:14px;font-weight:700;z-index:2000;transition:transform .4s;max-width:92vw;text-align:center;pointer-events:none;}
    .toast.show{transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

<div class="rcm-hero"><h1 class="rcm-hero-title">냥빙고</h1><img class="rcm-hero-cast box" src="images/box.png" alt="" width="360" height="473"></div>

<div class="page">
  <div class="intro">
    <p class="nick" id="hdr-nick"></p>
    <p>고양이를 관찰하고 사진을 찍어 올리면 AI 집사가 확인해요. 칸을 누르고 사진을 올려보세요.</p>
  </div>

  <div class="prog">
    <span id="prog-done">0 / 9 완료</span>
    <span class="prog-bingo" id="prog-bingo">빙고 0줄</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="notes">
    <span class="reward" id="reward-info"></span>
    <span>미션은 눈으로 관찰하는 것만으로 달성돼요. 안거나 깨우지 말고 멀리서 담아주세요.</span>
  </div>
</div>
<div class="rcm-roof"></div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-name" id="sh-name"></div>
    <div class="upload-wrap" id="upload-wrap">
      <input type="file" accept="image/*" capture="environment" id="photo-input" onchange="handlePhoto(this)">
      <span class="upload-ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#C9301B" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <div class="upload-lbl">여기를 눌러 사진을 업로드하세요</div>
    </div>
    <div class="note-small">
      AI 판정을 위해 선택한 사진이 분석 서버로 전송됩니다.<br>다른 고객의 얼굴이 나오지 않도록 촬영해주세요.
    </div>
    <img id="photo-preview" alt="">
    <button type="button" class="rcm-btn judge-btn" id="judge-btn" onclick="judgePhoto()">AI 집사에게 판정받기</button>
    <div class="loading" id="loading">AI 집사가 확인 중…</div>
    <div class="result" id="result"></div>
    <button type="button" class="rcm-btn ghost" onclick="closeModal()">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, runTransaction, increment }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqxMZf8xDfaQ1oAheXJAuYbWBBfZBkgvI",
  authDomain: "roofcatmeplay.firebaseapp.com",
  projectId: "roofcatmeplay",
  storageBucket: "roofcatmeplay.firebasestorage.app",
  messagingSenderId: "793320259272",
  appId: "1:793320259272:web:7ba8355067b03edc2b2ffd"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Worker (AI 판정) ─────────────────────────────────────────────
const WORKER_URL = 'https://super-mouse-c9f8.eom732.workers.dev';

// ── 미션 풀 ─────────────────────────────────────────────────────
const ALL = [
  {id:1, emoji:'🍞', name:'식빵 자세',           desc:'고양이가 앞발을 몸 아래에 접고 네모나게 웅크려 앉아있다'},
  {id:2, emoji:'🧼', name:'그루밍 중',            desc:'고양이가 자신의 몸을 핥거나 앞발로 얼굴을 닦으며 그루밍하고 있다'},

  {id:6, emoji:'🐱', name:'배 보이고 누운 고양이', desc:'고양이가 배를 위로 향하게 하여 드러누워 있다'},
  {id:7, emoji:'🐈', name:'2마리 붙어있음',        desc:'두 마리의 고양이가 서로 붙어서 앉아있거나 누워있다'},
  {id:8, emoji:'🐈‍⬛',name:'3마리 이상 한 컷',    desc:'사진 한 장에 고양이가 3마리 이상 보인다'},
  {id:9, emoji:'🖤', name:'까만 고양이',           desc:'검은색 털의 고양이가 사진에 있다'},
  {id:10,emoji:'🤍', name:'흰 고양이',             desc:'흰색 털의 고양이가 사진에 있다'},
  {id:11,emoji:'🐯', name:'줄무늬 고양이',         desc:'줄무늬(타비) 패턴의 고양이가 사진에 있다'},
  {id:12,emoji:'🪟', name:'창문 옆 고양이',        desc:'고양이가 창문 근처에 있거나 창문을 바라보고 있다'},
  {id:13,emoji:'📡', name:'꼬리 세운 고양이',      desc:'고양이 꼬리가 위로 곧게 바짝 세워져 있다'},
  {id:14,emoji:'🐾', name:'젤리 보이는 고양이',    desc:'고양이의 발바닥(젤리)이 카메라에 보인다'},
  {id:15,emoji:'🦵', name:'무릎 위 고양이',        desc:'고양이가 사람의 무릎이나 다리 위에 앉아있거나 누워있다'},
  {id:16,emoji:'📦', name:'박스 속 고양이',        desc:'고양이가 박스, 가방, 용기 등의 안에 들어가 있다'},
  {id:17,emoji:'📸', name:'카메라 정면 고양이',    desc:'고양이가 카메라를 정면으로 바라보고 있다'},
  {id:18,emoji:'🌀', name:'꼬리 감은 고양이',      desc:'고양이가 꼬리를 몸 주위로 감싸며 앉아있다'},
  {id:19,emoji:'🙆', name:'기지개 켜는 고양이',    desc:'고양이가 앞발을 앞으로 쭉 뻗고 기지개를 켜고 있다'},
  {id:20,emoji:'👆', name:'발로 누르는 고양이',    desc:'고양이가 앞발로 물체를 누르거나 건드리고 있다'},
  {id:21,emoji:'👃', name:'코 맞대는 고양이',      desc:'두 고양이가 서로 코를 맞대고 있다'},
  {id:22,emoji:'🗼', name:'캣타워 고양이',         desc:'고양이가 캣타워에 올라가 있다'},
  {id:23,emoji:'🔄', name:'뒤돌아 앉은 고양이',   desc:'고양이가 뒤를 향해 앉아서 등이나 뒷모습이 보인다'},
  {id:24,emoji:'😌', name:'눈 가늘게 뜬 고양이',  desc:'고양이가 눈을 반쯤 감고 가늘게 뜨고 있다'},
  {id:25,emoji:'💫', name:'꼬리 탁탁 치는 고양이',desc:'고양이가 앉아서 꼬리를 바닥에 탁탁 치고 있다'},
  {id:26,emoji:'👀', name:'눈 마주친 고양이',      desc:'고양이가 카메라나 사람을 직접 바라보며 눈이 마주쳤다'},
];

const BINGO_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const REWARD_CELL  = 2;
const REWARD_LINE  = 5;
const REWARD_CLEAR = 30;

// ── 상태 (Firestore 캐시) ───────────────────────────────────────
let userRef   = null;
let missions  = [];
let state     = [];
let doneLines = new Set();
let curCell   = -1;
let curPhoto  = null;

function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ── 초기화 ──────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if(!user){ location.href='login.html'; return; }
  userRef = doc(db,'users',user.uid);
  await initBingo();
});

async function initBingo(){
  // 새 보드 미리 생성 (transaction 안에서 랜덤 생성 금지)
  const candidateMissions = [...ALL].sort(()=>Math.random()-.5).slice(0,9);
  let committedMissions, committedState, committedLines, committedNick;

  try{
    await runTransaction(db, async tx=>{
      const snap = await tx.get(userRef);
      if(!snap.exists()) throw new Error('NO_USER');
      const data = snap.data();
      committedNick = data.nickname || '손님';

      if(data.bingoDate === today()){
        // 이미 오늘 보드 있음 — 그대로 사용
        committedMissions = data.bingoMissions || [];
        committedState    = data.bingoState    || Array(9).fill(false);
        committedLines    = data.bingoLines    || [];
      } else {
        // 새 보드 생성 — transaction 안에서 저장
        committedMissions = candidateMissions;
        committedState    = Array(9).fill(false);
        committedLines    = [];
        tx.update(userRef, {
          bingoDate:     today(),
          bingoMissions: committedMissions,
          bingoState:    committedState,
          bingoLines:    committedLines
        });
      }
    });

    // commit 성공 후 로컬 반영
    missions  = committedMissions;
    state     = committedState;
    doneLines = new Set(committedLines);
    document.getElementById('hdr-nick').textContent = committedNick + '님의 빙고판';
    localStorage.setItem('rcm_nickname', committedNick);
    render();
  } catch(e){
    showToast('빙고판을 불러오지 못했어요. 새로고침 해주세요.');
  }
}

// ── 렌더링 ──────────────────────────────────────────────────────
const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
function cellHTML(m, done){
  return `<div class="cell-name">${m.name}</div>${done?'<div class="cell-check" aria-label="완료">'+CHECK_SVG+'</div>':''}`;
}

function render(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  missions.forEach((m,i)=>{
    const c = document.createElement('div');
    c.className = 'cell' + (state[i] ? ' done' : '');
    c.innerHTML = cellHTML(m, state[i]);
    if(!state[i]){
      c.tabIndex = 0; c.setAttribute('role','button');
      c.addEventListener('click', ()=>openModal(i));
      c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModal(i); } });
    }
    g.appendChild(c);
  });
  updateProg();
}

function updateProg(){
  document.getElementById('reward-info').textContent = '가챠권  칸 +'+REWARD_CELL+' · 한 줄 +'+REWARD_LINE+' · 완주 +'+REWARD_CLEAR;
  document.getElementById('prog-done').textContent = state.filter(Boolean).length + ' / 9 완료';
  document.getElementById('prog-bingo').textContent = '빙고 ' + doneLines.size + '줄';
}

// ── 모달 ────────────────────────────────────────────────────────
function openModal(i){
  curCell=i; curPhoto=null;
  const m=missions[i];
  document.getElementById('sh-name').textContent  = m.name;
  document.getElementById('upload-wrap').style.display = 'block';
  document.getElementById('photo-preview').style.display = 'none';
  document.getElementById('judge-btn').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('photo-input').value = '';
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  curCell=-1; curPhoto=null;
}
window.closeModal = closeModal;
window.overlayClick = function(e){
  if(e.target===document.getElementById('overlay')) closeModal();
};

// ── 사진 업로드 ─────────────────────────────────────────────────
window.handlePhoto = function(input){
  if(!input.files||!input.files[0]) return;
  compressImage(input.files[0]).then(b64=>{
    curPhoto = b64;
    const p = document.getElementById('photo-preview');
    p.src = 'data:image/jpeg;base64,'+b64;
    p.style.display = 'block';
    document.getElementById('upload-wrap').style.display = 'none';
    document.getElementById('judge-btn').style.display = 'block';
    document.getElementById('result').style.display = 'none';
  });
};

function compressImage(file){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=800;
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',.8).split(',')[1]);
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

// ── AI 판정 ─────────────────────────────────────────────────────
window.judgePhoto = async function(){
  if(!curPhoto||curCell<0) return;
  const m=missions[curCell];
  document.getElementById('judge-btn').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('result').style.display='none';

  try{
    const res = await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({missionId:m.id, image:curPhoto})
    });
    if(!res.ok) throw new Error('WORKER_ERROR');
    const data = await res.json();
    const ok   = (data.result||'').trim().toUpperCase() === 'YES';

    document.getElementById('loading').style.display='none';
    const el=document.getElementById('result');
    el.style.display='block';

    if(ok){
      el.className='result ok';
      el.textContent='미션 달성!';
      await markDone(curCell);
      setTimeout(closeModal, 1200);
    } else {
      el.className='result ng';
      el.textContent='아직 아닌 것 같아요. 다시 도전해보세요.';
      setTimeout(()=>{
        document.getElementById('upload-wrap').style.display='block';
        document.getElementById('photo-preview').style.display='none';
        document.getElementById('judge-btn').style.display='none';
        document.getElementById('photo-input').value='';
        el.style.display='none';
        curPhoto=null;
      }, 1500);
    }
  } catch(err){
    document.getElementById('loading').style.display='none';
    const el=document.getElementById('result');
    el.style.display='block';
    el.className='result ng';
    el.textContent='네트워크 오류. 다시 시도해주세요.';
    document.getElementById('judge-btn').style.display='block';
  }
};

// ── 미션 완료 (Firestore transaction) ──────────────────────────
async function markDone(idx){
  let committedState, committedLines, newLineCount, total, isComplete;

  try{
    await runTransaction(db, async tx=>{
      const snap = await tx.get(userRef);
      if(!snap.exists()) throw new Error('NO_USER');
      const data = snap.data();

      // 오늘 보드 검증
      if(data.bingoDate !== today()) throw new Error('DATE_MISMATCH');
      const currState = [...(data.bingoState||Array(9).fill(false))];
      // 이미 완료된 칸이면 중복 처리 방지
      if(currState[idx]) throw new Error('ALREADY_DONE');
      // 미션 ID 검증 — 서버 보드와 로컬 보드가 다르면 차단
      const serverMissions = data.bingoMissions || [];
      if(serverMissions[idx]?.id !== missions[idx]?.id) throw new Error('BOARD_MISMATCH');

      // 새 state 계산
      const newState = [...currState];
      newState[idx] = true;

      // 새로 완성된 줄 계산
      const currLines = data.bingoLines || [];
      const newLines  = [];
      BINGO_LINES.forEach((line,i)=>{
        if(!currLines.includes(i) && line.every(j=>newState[j])) newLines.push(i);
      });
      const allLines = [...currLines, ...newLines];

      // 보상 계산
      isComplete    = newState.every(Boolean);
      newLineCount  = newLines.length;
      const cellR   = REWARD_CELL;
      const lineR   = newLineCount * REWARD_LINE;
      const clearR  = isComplete ? REWARD_CLEAR : 0;
      total = cellR + lineR + clearR;

      // Firestore 업데이트 (임시 변수에 저장)
      committedState = newState;
      committedLines = allLines;

      tx.update(userRef, {
        bingoState: newState,
        bingoLines: allLines,
        tickets:    increment(total)
      });
    });

    // commit 성공 후 로컬 상태 반영
    state     = committedState;
    doneLines = new Set(committedLines);

    // UI 업데이트
    const cells = document.querySelectorAll('.cell');
    cells[idx].className = 'cell done just-done';
    cells[idx].innerHTML = cellHTML(missions[idx], true);
    cells[idx].removeAttribute('role'); cells[idx].removeAttribute('tabindex');

    // localStorage 캐시 갱신 (gacha 등 다른 페이지 참조용)
    const t = parseInt(localStorage.getItem('rcm_gacha_tickets')||'0');
    localStorage.setItem('rcm_gacha_tickets', t + total);

    // 합산 토스트
    const parts = ['칸 +'+REWARD_CELL];
    if(newLineCount > 0) parts.push('빙고 +'+(newLineCount*REWARD_LINE));
    if(isComplete) parts.push('완주 +'+REWARD_CLEAR);
    showToast('가챠권 총 '+total+'개 획득  '+parts.join(' · '));

    updateProg();
  } catch(e){
    if(e.message==='ALREADY_DONE'){
      // 다른 기기에서 이미 완료 — 최신 상태로 재동기화
      await initBingo();
      return;
    }
    if(e.message==='DATE_MISMATCH'){
      showToast('날짜가 바뀌었어요. 새로고침 해주세요.');
    } else if(e.message==='BOARD_MISMATCH'){
      showToast('빙고판이 달라졌어요. 다시 불러올게요.');
      await initBingo();
    } else{
      showToast('저장에 실패했어요. 다시 시도해주세요.');
    }
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
